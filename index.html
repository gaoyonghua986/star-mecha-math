        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.12, vol = 0.12, slideTo = null) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

              hints: [`📡 别急着拿 ${left} × 2！因为多拿走了 ${more} 个，剩下的 ${left} 个还不到一半！点沙盘看线段！`, `🛠️ 先把多拿走的 ${more} 个退回箱子，凑够真正的一半：${left} + ${more} = ${half} 个！`, `💡 真正的一半是 ${half} 个，原来总数 = ${half} × 2 = ${total} 个！`],
              successNote: `攻克三年级经典难关！“用去一半多${more}个”，先把 ${more} 加回剩余数凑齐半数（${half}），再乘2得 ${total}！`
            };
          }
        }
        case 't16': {
          if (stageIdx === 0) {
            const d = randInt(0, 6), base = [[8 + d, 1 + d, 6 + d], [3 + d, 5 + d, 7 + d], [4 + d, 9 + d, 2 + d]], magicSum = 15 + 3 * d, ans = base[0][1];
            return {
              topicId, stageIdx, badge: '第1关 · 九宫幻方能量阵',
              story: `深空星门的九宫能量阵要求【每一横行、每一竖列、每条斜线】上的 3 个数之和都完全相等！请破译第一行中间“？”处的能量密码！`,
              questionShort: '九宫阵中“？”处的数字是几？', unit: '', answer: String(ans),
              sandbox: { kind: 'magic_square', grid: [[base[0][0], '?', base[0][2]], base[1], base[2]], magicSum, row0SumKnown: base[0][0] + base[0][2], scanned: false },
              hints: [`📡 先找一条已经填满 3 个数的线算出“幻和”！点击沙盘【⚡ 扫描每行幻和】看看第2行加起来是多少！`, `🛠️ 第2行：${base[1][0]} + ${base[1][1]} + ${base[1][2]} = ${magicSum}！所以第一行 3 个数加起来也必须等于 ${magicSum}！`, `💡 ？ = ${magicSum} - ${base[0][0]} - ${base[0][2]} = ${ans}！`],
              successNote: `幻方破译成功！先由已知满行算出“幻和 = ${magicSum}”，再缺谁补谁（${ans}）！`
            };
          } else {
            const p = pickOne([
              { clue1: '甲驾驶的不是 1 号机', clue2: '乙驾驶的是 3 号机', ask: '丙', ans: '1' },
              { clue1: '甲驾驶的是 3 号机', clue2: '丙驾驶的不是 1 号机', ask: '乙', ans: '1' },
              { clue1: '乙驾驶的不是 1 号和 2 号机', clue2: '丙驾驶的不是 1 号机', ask: '丙', ans: '2' },
              { clue1: '甲驾驶的不是 1 号和 3 号机', clue2: '乙驾驶的不是 3 号机', ask: '丙', ans: '3' }
            ]);
            return {

              successNote: `神探级逻辑！画个 3×3 勾选排除表，把文字变成直观表格，再绕的推理题也一秒清晰！`

        }
      }

    function shuffleOptions(correctNum, distractors) {
      const set = new Set([String(correctNum)]);
      distractors.forEach(d => { if (d > 0) set.add(String(d)); });
      let pad = 1;
      while (set.size < 4) { set.add(String(correctNum + pad * 5)); pad++; }
      const arr = Array.from(set).slice(0, 4);
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    }

    function generateBlitzQuestion() {
      const kind = randInt(1, 5);
      if (kind === 1) {
        const base = pickOne([100, 200, 300]), d = pickOne([1, 2]), a = base - d, b = randInt(25, 88), ans = a + b;
        return { expr: `${a} + ${b}`, tip: `凑整百：${base} + ${b} - ${d}`, ans: String(ans), options: shuffleOptions(ans, [ans + 2*d, ans - 10, ans + 10]) };
      } else if (kind === 2) {
        const k = randInt(3, 9), ans = 25 * 4 * k;
        return { expr: `25 × ${4 * k}`, tip: `黄金搭档：25 × 4 × ${k} = 100 × ${k}`, ans: String(ans), options: shuffleOptions(ans, [ans - 50, ans + 100, ans - 100]) };
      } else if (kind === 3) {
        const c = randInt(220, 460), d = pickOne([1, 2]), sub = 100 - d, ans = c - sub;
        return { expr: `${c} - ${sub}`, tip: `多退少补：${c} - 100 + ${d}`, ans: String(ans), options: shuffleOptions(ans, [ans - 2*d, ans + 10, ans - 10]) };
      } else if (kind === 4) {
        const a = randInt(18, 82), c = 100 - a, b = randInt(35, 96), ans = 100 + b;
        return { expr: `${a} + ${b} + ${c}`, tip: `尾巴互补先牵手：(${a} + ${c}) + ${b}`, ans: String(ans), options: shuffleOptions(ans, [ans - 10, ans + 10, ans + 4]) };
      } else {
        const k = randInt(2, 7), ans = 1000 * k;
        return { expr: `125 × ${8 * k}`, tip: `超级搭档：125 × 8 × ${k} = 1000 × ${k}`, ans: String(ans), options: shuffleOptions(ans, [ans - 500, ans + 1000, ans - 200]) };
      }
    }

    function loadState() {

      let atk = 60 + (state.weaponLevel - 1) * 18, hp = 140 + (state.weaponLevel - 1) * 25;

    function render() {
      updateHeaderUI();
      const vp = document.getElementById('main-viewport');
      if (missionRuntime.activeTopicId) { document.getElementById('bottom-nav').classList.add('hidden'); vp.classList.remove('pb-24'); vp.classList.add('pb-6'); vp.innerHTML = renderActiveStageView(); return; }
      if (bossRuntime.activeBossId) { document.getElementById('bottom-nav').classList.add('hidden'); vp.classList.remove('pb-24'); vp.classList.add('pb-6'); vp.innerHTML = renderActiveBossBattleView(); return; }
      document.getElementById('bottom-nav').classList.remove('hidden'); vp.classList.add('pb-24'); vp.classList.remove('pb-6');
      if (state.activeTab === 'missions') vp.innerHTML = renderMissionsTab();
      else if (state.activeTab === 'boss') vp.innerHTML = renderBossHubTab();
      else if (state.activeTab === 'hangar') vp.innerHTML = renderHangarTab();
      else if (state.activeTab === 'blitz') vp.innerHTML = renderBlitzTab();
      else if (state.activeTab === 'parent') vp.innerHTML = renderParentTab();
    }

      const chapObj = CHAPTERS.find(c => c.id === state.selectedChapter) || CHAPTERS[0];

      }).join('');

      </section>
      <div class="grid grid-cols-4 gap-1.5 mb-2.5">${chapterTabs}</div>

    function selectChapter(cid) { sfxTap(); state.selectedChapter = cid; saveState(); render(); }
    function startTopic(topicId, stageIdx = 0) { sfxTap(); stopSpeech(); missionRuntime = { activeTopicId: topicId, stageIndex: stageIdx, prob: generateProblem(topicId, stageIdx), userInput: '', hintLevel: 0, feedbackMsg: '', feedbackType: '' }; render(); }
    function rerollCurrentStage() { sfxMechSwitch(); stopSpeech(); missionRuntime.prob = generateProblem(missionRuntime.activeTopicId, missionRuntime.stageIndex); missionRuntime.userInput = ''; missionRuntime.hintLevel = 0; missionRuntime.feedbackMsg = '🎲 已实时生成一组全新随机数字，试试真本事吧！'; missionRuntime.feedbackType = 'ok'; render(); }
    function exitMission() { sfxTap(); stopSpeech(); missionRuntime.activeTopicId = null; render(); }

    function renderActiveStageView() {
      const topic = TOPICS.find(t => t.id === missionRuntime.activeTopicId), prob = missionRuntime.prob;
      return `<div class="flex items-center justify-between mb-2.5 gap-1">
        <button onclick="exitMission()" class="tac-btn-slate px-2.5 py-1.5 text-xs">← 返回</button>
        <span class="text-xs font-extrabold text-[#FDE68A] truncate">${prob.badge}</span>
        <div class="flex items-center gap-1">
          <button onclick="rerollCurrentStage()" class="tac-btn-slate px-2 py-1.5 text-xs">🎲换数</button>
          <button onclick="triggerRadarHint()" class="tac-btn-cyan px-2.5 py-1.5 text-xs">📡提示(${missionRuntime.hintLevel}/3)</button>
        </div>
      </div>
      <div class="tac-panel p-3.5 mb-2.5">
        <div class="flex items-center justify-between gap-2 mb-1.5">
          <span class="text-xs font-bold text-[#38BDF8]">${topic.icon} ${topic.name}</span>
          <button onclick="speakCurrentStage()" class="px-2.5 py-1 rounded-lg text-xs font-bold border ${speakingNow ? 'bg-[#3B2314] border-[#FBBF24] text-[#FDE68A]' : 'bg-[#142744] border-[#38BDF8]/60 text-[#BAE6FD]'}">${speakingNow ? '⏹️ 停止播报' : '🔈 语音读题'}</button>
        </div>
        <p class="text-sm text-[#F8FAFC] leading-relaxed font-medium">${prob.story}</p>
      </div>
      ${missionRuntime.hintLevel > 0 ? `<div class="mb-2.5 p-3 rounded-xl bg-[#0F2942] border border-[#38BDF8]/60 space-y-1.5 text-xs text-[#E0F2FE]"><div class="flex justify-between items-center"><span class="font-extrabold text-[#FBBF24]">📡 机甲副官战术分析：</span><button onclick="speakHints()" class="text-[11px] underline text-[#38BDF8]">🔈 朗读提示</button></div>${prob.hints.slice(0, missionRuntime.hintLevel).map(h => `<div class="leading-relaxed">${h}</div>`).join('')}</div>` : ''}
      <div class="tac-panel p-3 mb-2.5">${renderDynamicSandbox(prob.sandbox)}</div>
      ${missionRuntime.feedbackMsg ? `<div class="mb-2.5 px-3 py-2 rounded-xl text-xs font-bold leading-relaxed border ${missionRuntime.feedbackType === 'ok' ? 'bg-[#064E3B] border-[#10B981] text-[#A7F3D0]' : 'bg-[#3B2314] border-[#F59E0B] text-[#FDE68A]'}">${missionRuntime.feedbackMsg}</div>` : ''}
      ${prob.choices ? renderChoicePad(prob) : renderThumbNumpad(prob, 'submitStageAnswer()')}`;
    }

    function speakCurrentStage() { if (missionRuntime.prob) speakText(missionRuntime.prob.story); }
    function speakHints() { if (missionRuntime.prob && missionRuntime.hintLevel > 0) speakText(missionRuntime.prob.hints.slice(0, missionRuntime.hintLevel).join('。')); }

    function renderDynamicSandbox(sb) {
      if (!sb) return '';
      switch (sb.kind) {
        case 'perim_stair': {
          const { W, H, slideH, slideV } = sb;
          return `<div class="flex items-center justify-between mb-2 gap-1"><span class="text-xs font-extrabold text-[#FBBF24]">📐 动态护盾平移画板</span><div class="flex gap-1.5"><button onclick="sbAction('stairH')" class="px-2.5 py-1 rounded-lg text-xs font-bold ${slideH ? 'bg-[#065F46] text-[#A7F3D0]' : 'bg-[#0EA5E9] text-white'}">⬆ 平移横边</button><button onclick="sbAction('stairV')" class="px-2.5 py-1 rounded-lg text-xs font-bold ${slideV ? 'bg-[#065F46] text-[#A7F3D0]' : 'bg-[#F59E0B] text-[#0B1220]'}">➡ 平移竖边</button></div></div>
          <div class="rounded-xl bg-[#0B1324] border border-[#23385C] p-2"><svg viewBox="0 0 265 170" class="w-full h-36"><polygon points="45,20 115,20 115,62 165,62 165,104 215,104 215,148 45,148" fill="rgba(56,189,248,0.1)" /><line x1="115" y1="20" x2="215" y2="20" stroke="#334E7B" stroke-width="2" stroke-dasharray="4 4" /><line x1="215" y1="20" x2="215" y2="104" stroke="#334E7B" stroke-width="2" stroke-dasharray="4 4" /><line x1="45" y1="20" x2="45" y2="148" stroke="#E2E8F0" stroke-width="3.5" /><line x1="45" y1="148" x2="215" y2="148" stroke="#E2E8F0" stroke-width="3.5" /><line x1="45" y1="20" x2="115" y2="20" stroke="#38BDF8" stroke-width="3.5" /><line x1="215" y1="104" x2="215" y2="148" stroke="#FBBF24" stroke-width="3.5" /><line class="slide-edge" x1="115" y1="${slideH ? 20 : 62}" x2="165" y2="${slideH ? 20 : 62}" stroke="#38BDF8" stroke-width="4" /><line class="slide-edge" x1="165" y1="${slideH ? 20 : 104}" x2="215" y2="${slideH ? 20 : 104}" stroke="#38BDF8" stroke-width="4" /><line class="slide-edge" x1="${slideV ? 215 : 115}" y1="20" x2="${slideV ? 215 : 115}" y2="62" stroke="#FBBF24" stroke-width="4" /><line class="slide-edge" x1="${slideV ? 215 : 165}" y1="62" x2="${slideV ? 215 : 165}" y2="104" stroke="#FBBF24" stroke-width="4" /><text x="18" y="90" fill="#F8FAFC" font-size="12" font-weight="bold">${H}米</text><text x="130" y="165" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="bold">${W}米</text>${slideH && slideV ? `<text x="130" y="90" text-anchor="middle" fill="#34D399" font-size="12" font-weight="bold">完整 ${W}×${H} 长方形！</text>` : ''}</svg></div>`;
        }
        case 'perim_u': {
          const { W, H, d, popped } = sb;
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">📐 凹字形装甲拆解画板</span><button onclick="sbAction('uPop')" class="px-2.5 py-1 rounded-lg text-xs font-bold ${popped ? 'bg-[#065F46] text-[#A7F3D0]' : 'bg-[#F59E0B] text-[#0B1220]'}">${popped ? '✅ 已标出多出的2条竖壁' : '🔍 高亮凹槽边'}</button></div>
          <div class="rounded-xl bg-[#0B1324] border border-[#23385C] p-2"><svg viewBox="0 0 265 170" class="w-full h-36"><polygon points="45,25 100,25 100,72 165,72 165,25 220,25 220,145 45,145" fill="rgba(56,189,248,0.1)" /><line x1="45" y1="25" x2="45" y2="145" stroke="#E2E8F0" stroke-width="3.5" /><line x1="45" y1="145" x2="220" y2="145" stroke="#E2E8F0" stroke-width="3.5" /><line x1="220" y1="25" x2="220" y2="145" stroke="#E2E8F0" stroke-width="3.5" /><line x1="45" y1="25" x2="100" y2="25" stroke="#38BDF8" stroke-width="3.5" /><line x1="165" y1="25" x2="220" y2="25" stroke="#38BDF8" stroke-width="3.5" /><line class="slide-edge" x1="100" y1="${popped ? 25 : 72}" x2="165" y2="${popped ? 25 : 72}" stroke="#34D399" stroke-width="4" /><line x1="100" y1="25" x2="100" y2="72" stroke="${popped ? '#F43F5E' : '#FBBF24'}" stroke-width="4.5" /><line x1="165" y1="25" x2="165" y2="72" stroke="${popped ? '#F43F5E' : '#FBBF24'}" stroke-width="4.5" /><text x="18" y="90" fill="#F8FAFC" font-size="12" font-weight="bold">${H}米</text><text x="132" y="162" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="bold">${W}米</text><text x="186" y="55" fill="#FDE68A" font-size="11" font-weight="bold">深${d}米</text>${popped ? `<text x="132" y="112" text-anchor="middle" fill="#FDA4AF" font-size="11" font-weight="bold">长方形周长 + 2条红边(${d}+${d})！</text>` : ''}</svg></div>`;
        }
        case 'calc_chip':
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">🧮 凑整能量转换芯片</span><button onclick="sbAction('calcMerge')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0EA5E9] text-white">⚡ 展开凑整变形</button></div>
          <div class="p-3 rounded-xl bg-[#0B1324] border border-[#23385C] text-center">${!sb.merged ? `<div class="text-lg font-mono font-extrabold text-[#F8FAFC]">${sb.A} ${sb.mode === 'add' ? '+' : '-'} ${sb.B}</div><div class="text-xs text-[#94A3B8] mt-1">点击右上角，把贴近整百的数变成 ${sb.base}！</div>` : sb.mode === 'add' ? `<div class="text-base font-mono font-extrabold text-[#34D399]">(${sb.base} + ${sb.B}) - ${sb.diff} = ${sb.base + sb.B} - ${sb.diff}</div><div class="text-xs text-[#BAE6FD] mt-1">先加 ${sb.base} 多加了 ${sb.diff}，尾巴减 ${sb.diff} 秒出结果！</div>` : `<div class="text-base font-mono font-extrabold text-[#FBBF24]">(${sb.A} - ${sb.base}) + ${sb.diff} = ${sb.A - sb.base} + ${sb.diff}</div><div class="text-xs text-[#FDE68A] mt-1">先减 ${sb.base} 多扣了 ${sb.diff}，必须加回 ${sb.diff} 哦！</div>`}</div>`;
        case 'trees_line':
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">🗼 ${sb.L}米直桥（每${sb.step}米一段，共${sb.gaps}段）</span><button onclick="sbAction('treesLit')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0EA5E9] text-white">⚡ 点亮全线</button></div>
          <div class="p-3 rounded-xl bg-[#0B1324] border border-[#23385C]"><div class="relative flex items-center justify-between py-2"><div class="absolute left-2 right-2 top-5 h-1 bg-[#263F6B]"></div>${Array.from({ length: sb.gaps + 1 }, (_, i) => `<div class="relative z-10 flex flex-col items-center"><div class="w-6 h-6 rounded-full border flex items-center justify-center text-xs ${sb.lit || i === 0 ? 'bg-[#064E3B] border-[#34D399]' : 'bg-[#16243D] border-[#3B5584]'}">${sb.lit || i === 0 ? '🗼' : '·'}</div><span class="text-[9px] font-mono text-[#94A3B8] mt-0.5">${i * sb.step}</span></div>`).join('')}</div><div class="text-xs text-center text-[#CBD5E1] mt-1">${sb.lit ? `✅ ${sb.gaps} 段间隔，两端都装一共立起 <strong class="text-[#34D399]">${sb.gaps + 1} 座</strong> 激光塔！` : '点击【点亮全线】数一数！'}</div></div>`;
        case 'trees_ring':
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">🎡 周长${sb.L}米环形轨道（每${sb.step}米1段）</span><button onclick="sbAction('treesLit')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">⚡ 点亮圆环信标</button></div>
          <div class="p-2 rounded-xl bg-[#0B1324] border border-[#23385C] text-center"><svg viewBox="0 0 200 130" class="w-full h-28"><circle cx="100" cy="65" r="46" fill="none" stroke="#2D4A77" stroke-width="3" />${Array.from({ length: sb.gaps }, (_, i) => { const ang = (i / sb.gaps) * Math.PI * 2 - Math.PI / 2; return `<circle cx="${(100 + 46 * Math.cos(ang)).toFixed(1)}" cy="${(65 + 46 * Math.sin(ang)).toFixed(1)}" r="7" fill="${sb.lit ? '#34D399' : '#1E293B'}" stroke="#F8FAFC" stroke-width="1.5" />`; }).join('')}<text x="100" y="69" text-anchor="middle" fill="#FDE68A" font-size="11" font-weight="bold">${sb.lit ? `共 ${sb.gaps} 颗！` : `${sb.gaps} 段弧`}</text></svg></div>`;
        case 'legs_grid': {
          const curSum = sb.started ? sb.units.reduce((a, b) => a + b, 0) : 0, remain = sb.target - curSum, highCount = sb.units.filter(v => v === sb.high).length;
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">🛠️ 点击舱位切换 ${sb.low} / ${sb.high}${sb.itemUnit}</span>${!sb.started ? `<button onclick="sbAction('legsStart')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">① 全员按${sb.low}${sb.itemUnit}启动</button>` : ''}</div>
          <div class="grid grid-cols-4 gap-1.5 my-2">${sb.units.map((val, idx) => `<button onclick="sbToggleUnit(${idx})" class="py-2 px-1 rounded-xl border text-center active:scale-95 ${!sb.started ? 'bg-[#0D1729] border-[#263B61] text-[#64748B]' : val === sb.high ? 'bg-[#3B2314] border-[#FBBF24] text-[#FDE68A]' : 'bg-[#12263F] border-[#38BDF8]/60 text-[#BAE6FD]'}"><div class="text-base leading-none">${!sb.started ? '❔' : (val === sb.high ? sb.highIcon : sb.lowIcon)}</div><div class="text-[10px] font-bold mt-1">${!sb.started ? `#${idx+1}` : `${val}${sb.itemUnit}`}</div></button>`).join('')}</div>
          <div class="px-2.5 py-1.5 rounded-lg bg-[#0B1324] border border-[#23385C] flex justify-between text-xs"><span>当前：<strong class="text-[#38BDF8] font-mono">${curSum}</strong> / ${sb.target}${sb.itemUnit}</span><span class="${remain === 0 ? 'text-[#34D399] font-extrabold' : 'text-[#FBBF24] font-bold'}">${!sb.started ? '先点右上角启动' : remain === 0 ? `✅ 吻合！答案 = ${highCount}` : remain > 0 ? `还差 ${remain} ${sb.itemUnit}` : `超了 ${Math.abs(remain)}`}</span></div>`;
        }
        case 'cycle_pack': {
          const icons = ['🔥', '⚡', '🛡️', '🌿'];
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">🎡 1 ～ ${sb.K} 号循环充能舱</span><button onclick="sbAction('packCycle')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">${sb.packed ? '✅ 已分箱' : '📦 按4舱打包分箱'}</button></div>
          <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C] text-xs">${!sb.packed ? `<div class="flex items-center justify-around py-2 text-sm"><span>#1🔥</span><span>→</span><span>#2⚡</span><span>→</span><span>#3🛡️</span><span>→</span><span>#4🌿</span><span>→…→</span><span class="font-bold text-[#FBBF24]">#${sb.K}❔</span></div>` : `<div class="text-[#BAE6FD] font-bold mb-1.5">📦 ${sb.K} ÷ 4 = ${sb.groups} 整箱${sb.rem === 0 ? '（整除无余数！）' : ` …… 余 ${sb.rem} 个舱：`}</div><div class="flex items-center gap-2">${sb.rem === 0 ? `<span class="px-2.5 py-1 rounded bg-[#064E3B] border border-[#34D399] text-[#A7F3D0] font-bold">落在箱尾：🌿绿芒！</span>` : Array.from({ length: sb.rem }, (_, r) => `<span class="px-2.5 py-1 rounded ${r === sb.rem - 1 ? 'bg-[#3B2314] border-2 border-[#FBBF24] text-[#FDE68A] font-extrabold' : 'bg-[#16243D] text-[#94A3B8]'}">余${r+1}:${icons[r]}</span>`).join('')}</div>`}</div>`;
        }
        case 'cycle_fleet':
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">🛸 每组 ${sb.P} 台（1先锋+${sb.guardsPerGroup}护卫+1支援）</span><button onclick="sbAction('expandFleet')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0EA5E9] text-white">展开编队</button></div>
          <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C] text-xs">${!sb.expanded ? `<div class="text-[#94A3B8]">前 ${sb.K} 台可分成几整组？余下几台？点【展开编队】！</div>` : `<div class="space-y-1"><div class="text-[#38BDF8] font-bold">✅ 完整编队：${sb.groups}组 × ${sb.guardsPerGroup}台护卫 = ${sb.groups * sb.guardsPerGroup}台</div><div class="text-[#FDE68A] font-bold">⚡ 余下${sb.rem}台：🚀先锋 ${'🛡️护卫 '.repeat(sb.extraGuards)} → 护卫 +${sb.extraGuards}台！</div></div>`}</div>`;
        case 'bar_sum_mult': {
          const okM = sb.curM === sb.M;
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">📊 倍数线段图（共 ${sb.sum} 颗）</span>${sb.extra === 0 ? `<div class="flex gap-1"><button onclick="sbMultDelta(-1)" class="w-7 h-7 rounded bg-[#1E2F4F] text-xs font-bold">-1</button><button onclick="sbMultDelta(1)" class="w-7 h-7 rounded bg-[#F59E0B] text-[#0B1220] text-xs font-extrabold">+1</button></div>` : `<button onclick="sbAction('barDist')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">✂️ 剪掉零头+${sb.extra}</button>`}</div>
          <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C] space-y-2 text-xs"><div class="flex items-center gap-2"><span class="w-12 text-[#94A3B8]">副库</span><div class="w-14 h-7 rounded bg-[#163459] border border-[#38BDF8] flex items-center justify-center font-bold text-[#BAE6FD]">${sb.distributed && okM ? sb.unit : '1份'}</div></div><div class="flex items-center gap-2"><span class="w-12 text-[#FDE68A] font-bold">主库</span><div class="flex gap-1 items-center flex-wrap">${Array.from({ length: sb.curM }, () => `<div class="w-14 h-7 rounded bg-[#3B2314] border border-[#FBBF24] flex items-center justify-center font-bold text-[#FDE68A]">${sb.distributed && okM ? sb.unit : '1份'}</div>`).join('')}${sb.extra > 0 ? `<span class="px-2 py-1 rounded border border-dashed border-[#F43F5E] text-[#FDA4AF] ${sb.distributed ? 'opacity-45' : ''}">+${sb.extra}</span>` : ''}</div></div>${okM && sb.extra === 0 && !sb.distributed ? `<button onclick="sbAction('barDist')" class="tac-btn-cyan w-full py-1.5 text-xs mt-1">⚡ 把 ${sb.sum} 颗均分进 ${1+sb.M} 份</button>` : ''}</div>`;
        }
        case 'bar_diff_mult':
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">⚡ 差倍对齐沙盘（相差 ${sb.diff}）</span><button onclick="sbAction('diffMultRev')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0EA5E9] text-white">🔍 对齐比较差值</button></div>
          <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C] space-y-2 text-xs"><div class="flex items-center gap-1.5"><span class="w-12 text-[#94A3B8]">1倍量</span><div class="w-12 h-7 rounded bg-[#163459] border border-[#38BDF8] flex items-center justify-center font-bold">${sb.revealed ? sb.unit : '1份'}</div></div><div class="flex items-center gap-1.5"><span class="w-12 text-[#FDE68A] font-bold">${sb.M}倍量</span><div class="w-12 h-7 rounded bg-[#163459] border border-[#38BDF8] flex items-center justify-center font-bold">${sb.revealed ? sb.unit : '1份'}</div>${Array.from({ length: sb.M - 1 }, () => `<div class="w-12 h-7 rounded bg-[#3B2314] border-2 border-[#FBBF24] flex items-center justify-center font-bold text-[#FDE68A]">${sb.revealed ? sb.unit : '多1份'}</div>`).join('')}</div>${sb.revealed ? `<div class="text-[#34D399] font-bold">💡 多出的 ${sb.M - 1} 份 = ${sb.diff}，每份 = ${sb.unit}！</div>` : ''}</div>`;
        case 'bar_sum_diff':
          return `<div class="flex items-center justify-between mb-2"><span class="text-xs font-extrabold text-[#FBBF24]">✂️ 和差激光切割台（共 ${sb.sum}）</span><button onclick="sbAction('sumDiffCut')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">✂️ 切去多出的+${sb.diff}</button></div>
          <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C] space-y-2 text-xs"><div class="flex items-center gap-2"><span class="w-10 text-[#FDE68A] font-bold">左翼</span><div class="h-7 px-4 rounded bg-[#163459] border border-[#38BDF8] flex items-center">${sb.cut ? sb.right : '右翼长'}</div><div class="h-7 px-2.5 rounded border border-[#FBBF24] bg-[#3B2314] text-[#FDE68A] flex items-center font-bold ${sb.cut ? 'opacity-45 translate-x-2 border-dashed' : ''}">+${sb.diff}</div></div><div class="flex items-center gap-2"><span class="w-10 text-[#94A3B8]">右翼</span><div class="h-7 px-4 rounded bg-[#163459] border border-[#38BDF8] flex items-center">${sb.cut ? sb.right : '？'}</div></div>${sb.cut ? `<div class="text-[#BAE6FD]">切掉 ${sb.diff} 剩 ${sb.sum - sb.diff}，平分得右翼=${sb.right}，左翼=${sb.right}+${sb.diff}！</div>` : ''}</div>`;
        case 'transfer_bars': {

    function sbAction(act) {
      sfxMechSwitch();
      const sb = missionRuntime.prob && missionRuntime.prob.sandbox;
      if (!sb) return;
      if (act === 'stairH') sb.slideH = !sb.slideH;
      else if (act === 'stairV') sb.slideV = !sb.slideV;
      else if (act === 'uPop') sb.popped = !sb.popped;
      else if (act === 'calcMerge') sb.merged = !sb.merged;
      else if (act === 'treesLit') sb.lit = !sb.lit;
      else if (act === 'legsStart') sb.started = true;
      else if (act === 'packCycle') sb.packed = !sb.packed;
      else if (act === 'expandFleet') sb.expanded = !sb.expanded;
      else if (act === 'barDist') sb.distributed = !sb.distributed;
      else if (act === 'diffMultRev') sb.revealed = !sb.revealed;
      else if (act === 'sumDiffCut') sb.cut = !sb.cut;
      else if (act === 'transferMove') sb.moved = !sb.moved;
      else if (act === 'multSplit') sb.split = !sb.split;
      else if (act === 'distCombine') sb.combined = !sb.combined;
      else if (act === 'funnelSolve') sb.solvedUnit = !sb.solvedUnit;
      else if (act === 'ageSumRev') sb.revealed = !sb.revealed;
      else if (act === 'vennSep') sb.separated = !sb.separated;
      else if (act === 'fireLines') sb.fired = !sb.fired;
      else if (act === 'scanRects') sb.scanned = !sb.scanned;
      else if (act === 'scaleChain') sb.expanded = !sb.expanded;
      else if (act === 'scaleDiff') sb.diffed = !sb.diffed;
      else if (act === 'revPipe') sb.reversed = !sb.reversed;
      else if (act === 'halfRestore') sb.restored = !sb.restored;
      else if (act === 'scanMagic') sb.scanned = !sb.scanned;
      render();
    }
    function sbToggleUnit(idx) { sfxMechSwitch(); const sb = missionRuntime.prob.sandbox; sb.started = true; sb.units[idx] = sb.units[idx] === sb.low ? sb.high : sb.low; render(); }
    function sbMultDelta(d) { sfxMechSwitch(); const sb = missionRuntime.prob.sandbox; sb.curM = Math.max(1, Math.min(5, sb.curM + d)); sb.distributed = false; render(); }
    function sbAgeStep(d) { sfxMechSwitch(); const sb = missionRuntime.prob.sandbox; sb.offset = Math.max(0, Math.min(10, sb.offset + d)); render(); }
    function sbToggleLogic(idx) { sfxTap(); const sb = missionRuntime.prob.sandbox; sb.cells[idx] = (sb.cells[idx] + 1) % 3; render(); }
    function triggerRadarHint() { sfxHint(); if (missionRuntime.hintLevel < 3) { missionRuntime.hintLevel += 1; state.hintsUsedCount += 1; saveState(); } render(); }

    function renderChoicePad(prob, isBoss = false) {
      return `<div class="tac-panel p-3"><div class="text-xs font-bold text-[#CBD5E1] mb-2">${prob.questionShort}</div><div class="grid grid-cols-2 gap-2">${prob.choices.map(c => `<button onclick="${isBoss ? `submitBossChoice('${c.val}')` : `submitStageChoice('${c.val}')`}" class="py-2.5 px-3 rounded-xl border-2 font-extrabold text-sm active:scale-95 ${c.color}">${c.label}</button>`).join('')}</div></div>`;
    }

    function renderThumbNumpad(prob, submitFnStr, curVal = null) {
      const valShown = curVal !== null ? curVal : missionRuntime.userInput, keyTarget = curVal !== null ? 'boss' : 'stage';
      return `<div class="tac-panel p-3"><div class="flex items-center justify-between mb-2 px-1"><span class="text-xs font-bold text-[#CBD5E1]">${prob.questionShort}</span><div class="flex items-center gap-1.5"><div class="min-w-[80px] h-9 px-3 rounded-lg bg-[#09101E] border-2 border-[#38BDF8] flex items-center justify-center font-mono text-lg font-extrabold text-[#FBBF24]">${valShown || '?'}</div><span class="text-xs font-bold text-[#94A3B8]">${prob.unit || ''}</span></div></div><div class="grid grid-cols-4 gap-1.5">${['1','2','3','⌫','4','5','6','清空','7','8','9','0'].map(key => key === '⌫' ? `<button onclick="pressKey('${keyTarget}','BACK')" class="numpad-key text-xs text-[#FDA4AF]">⌫ 退格</button>` : key === '清空' ? `<button onclick="pressKey('${keyTarget}','CLR')" class="numpad-key text-xs text-[#94A3B8]">清空</button>` : `<button onclick="pressKey('${keyTarget}','${key}')" class="numpad-key">${key}</button>`).join('')}</div><button onclick="${submitFnStr}" class="tac-btn-primary w-full py-2.5 mt-2.5 text-sm">${curVal !== null ? '⚔️ 发射主炮轰击巨兽！' : '🚀 确认发射校准能量'}</button></div>`;
    }

    function pressKey(target, k) {
      sfxTap();
      const obj = target === 'boss' ? bossRuntime : missionRuntime;
      if (k === 'BACK') obj.userInput = obj.userInput.slice(0, -1);
      else if (k === 'CLR') obj.userInput = '';
      else if (obj.userInput.length < 5) obj.userInput += k;
      render();
    }

    function submitStageChoice(val) { missionRuntime.userInput = val; submitStageAnswer(); }

    function submitStageAnswer() {
      stopSpeech();
      const topic = TOPICS.find(t => t.id === missionRuntime.activeTopicId), prob = missionRuntime.prob, cleaned = String(missionRuntime.userInput).trim();
      if (!cleaned) { sfxRecalibrate(); missionRuntime.feedbackType = 'warn'; missionRuntime.feedbackMsg = '🛰️ 请先用数字键输入校准数值哦！'; render(); return; }
      if (cleaned === prob.answer) {
        sfxSuccess(); state.crystals += 35; saveState();
        if (missionRuntime.stageIndex === 0) {
          showModal(`<div class="text-4xl mb-1">🎯</div><h3 class="text-lg font-extrabold text-[#34D399]">第 1 关沙盘破冰成功！</h3><p class="text-xs text-[#E2E8F0] mt-2 leading-relaxed text-left bg-[#0D1729] p-3 rounded-xl border border-[#243B61]">${prob.successNote}</p><div class="text-xs font-bold text-[#FBBF24] mt-2">+35 💎 超导晶石</div><button onclick="proceedStageTwo()" class="tac-btn-primary w-full py-3 mt-3 text-sm">⚡ 进入第 2 关：变式跃迁挑战</button>`);
        } else {
          state.topicClears[topic.id] = (state.topicClears[topic.id] || 0) + 1;
          let unlockedMsg = '';
          if (topic.reward && !state.unlockedParts.includes(topic.reward)) {
            state.unlockedParts.push(topic.reward); state.hasNewPartBadge = true;
            const p = MECHA_PARTS[topic.reward];

    function submitBossChoice(val) { bossRuntime.userInput = val; submitBossAnswer(); }
    function submitBossAnswer() {
      stopSpeech();
      const boss = BOSSES.find(b => b.id === bossRuntime.activeBossId), stats = getMechaCombatStats(), cleaned = String(bossRuntime.userInput).trim();
      if (!cleaned) return;
      if (cleaned === bossRuntime.prob.answer) {
        sfxLaserHit(); bossRuntime.combo += 1;
        const dmg = Math.round(stats.atk * (bossRuntime.combo >= 2 ? 1.35 : 1.0));
        bossRuntime.bossHp = Math.max(0, bossRuntime.bossHp - dmg); bossRuntime.bossHitAnim = true;
        bossRuntime.battleLog = `💥 命中弱点！${bossRuntime.combo >= 2 ? '【连击暴击】' : ''}主炮轰出 ${dmg} 点伤害！`;
        if (bossRuntime.bossHp <= 0) {
          if (!state.defeatedBosses.includes(boss.id)) state.defeatedBosses.push(boss.id);
          state.crystals += boss.rewardCrystals; saveState(); setTimeout(() => sfxUnlockPart(), 150);
          showModal(`<div class="text-4xl mb-1">🎉</div><h3 class="text-lg font-extrabold text-[#FBBF24]">成功讨伐【${boss.name}】！</h3><p class="text-xs text-[#A7F3D0] mt-2">获得荣耀勋章：<strong>${boss.medal}</strong></p><p class="text-xs text-[#FDE68A] mt-1">战利品：+${boss.rewardCrystals} 💎 超导晶石 ${boss.id === 'b1' ? '｜已解锁【暗星曜金】限定涂装！' : ''}</p><button onclick="closeBossModal('boss')" class="tac-btn-primary w-full py-2.5 mt-4 text-xs">凯旋返回母港</button>`);
          return;
        }

        sfxBossAttack(); bossRuntime.combo = 0; bossRuntime.playerHp = Math.max(0, bossRuntime.playerHp - boss.atk); bossRuntime.bossHitAnim = false;
        bossRuntime.battleLog = `🛡️ 校准偏差（正确为 ${bossRuntime.prob.answer}）！护盾抵挡巨兽反击 -${boss.atk} HP！`;
        if (bossRuntime.playerHp <= 0) {
          showModal(`<div class="text-4xl mb-1">🔧</div><h3 class="text-lg font-extrabold text-[#38BDF8]">护盾能量耗尽 · 紧急返航</h3><p class="text-xs text-[#CBD5E1] mt-2 leading-relaxed">去【16专题】收集更多部件或去【机甲库】升级核心等级再来复仇吧！</p><button onclick="closeBossModal('hangar')" class="tac-btn-primary w-full py-2.5 mt-4 text-xs">前往机甲工坊强化</button>`);
          return;
        }
      }
      bossRuntime.turn += 1; bossRuntime.userInput = ''; bossRuntime.prob = generateProblem(pickOne(boss.topics), randInt(0, 1)); render();
      setTimeout(() => { bossRuntime.bossHitAnim = false; }, 500);

    function renderHangarTab() {

      const chapterStats = CHAPTERS.map(c => { const ts = TOPICS.filter(t => t.chapter === c.id), done = ts.filter(t => (state.topicClears[t.id] || 0) > 0).length; return { name: c.full.split('：')[1], pct: Math.round((done / ts.length) * 100), done, total: ts.length }; });
      return `<section class="tac-panel p-4 mb-3"><div class="flex items-center justify-between mb-2"><h2 class="text-sm font-extrabold text-[#F8FAFC]">📊 三年级奥数 16 专题成长雷达</h2><span class="text-[11px] px-2 py-0.5 rounded bg-[#1A2E4C] text-[#38BDF8]">V2.0 无限变式版</span></div><div class="grid grid-cols-3 gap-2 my-2.5 text-center"><div class="p-2 rounded-xl bg-[#0B1324] border border-[#23385C]"><div class="text-base font-mono font-extrabold text-[#34D399]">${clearedTopics}/16</div><div class="text-[10px] text-[#94A3B8]">已点亮专题</div></div><div class="p-2 rounded-xl bg-[#0B1324] border border-[#23385C]"><div class="text-base font-mono font-extrabold text-[#FBBF24]">${totalRuns}局</div><div class="text-[10px] text-[#94A3B8]">累计随机刷题</div></div><div class="p-2 rounded-xl bg-[#0B1324] border border-[#23385C]"><div class="text-base font-mono font-extrabold text-[#FDA4AF]">${state.defeatedBosses.length}/3</div><div class="text-[10px] text-[#94A3B8]">击败巨兽</div></div></div><div class="space-y-2 mt-3">${chapterStats.map(cs => `<div><div class="flex justify-between text-xs mb-1"><span class="text-[#E2E8F0]">${cs.name}</span><span class="font-mono text-[#38BDF8]">${cs.done}/${cs.total} (${cs.pct}%)</span></div><div class="h-2 rounded-full bg-[#0B1324] overflow-hidden border border-[#22375B]"><div class="h-full bg-gradient-to-r from-[#0EA5E9] to-[#34D399]" style="width:${Math.max(cs.pct, 4)}%"></div></div></div>`).join('')}</div></section>
      <section class="tac-panel p-3.5 space-y-2"><h3 class="text-xs font-extrabold text-[#CBD5E1]">🛠️ 家长体验与重置面板</h3><p class="text-xs text-[#94A3B8] leading-relaxed">建议平日每天碎片时间闯 1 个新专题（2关约3分钟），周末挑战一次【👾 Boss战】检验综合实力！</p><div class="grid grid-cols-2 gap-2 pt-1"><button onclick="unlockAllDemo()" class="tac-btn-cyan py-2.5 text-xs">✨ 一键满配演示</button><button onclick="resetProgressClean()" class="tac-btn-slate py-2.5 text-xs text-[#FDA4AF]">🔄 重置给孩子正式玩</button></div></section>`;
    }

    function showModal(innerHtml) { document.getElementById('modal-box').innerHTML = innerHtml; document.getElementById('modal-overlay').classList.remove('hidden'); }
    function hideModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
    function closeModalAndGo(tab) { sfxTap(); hideModal(); missionRuntime.activeTopicId = null; state.activeTab = tab; saveState(); render(); }
    function unlockAllDemo() { sfxUnlockPart(); state.unlockedParts = Object.keys(MECHA_PARTS); TOPICS.forEach(t => { state.topicClears[t.id] = 1; }); state.defeatedBosses = ['b1']; state.weaponLevel = 5; state.crystals = 880; state.hasNewPartBadge = true; saveState(); render(); }
    function resetProgressClean() { sfxTap(); stopSpeech(); state = JSON.parse(JSON.stringify(defaultState)); saveState(); render(); }

    document.addEventListener('touchstart', function() { getAudioCtx(); }, { once: true, passive: true });
    render();
  </script>
</body>
</html>
