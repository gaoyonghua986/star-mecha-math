    let soundEnabled = true;

    function getAudioCtx() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.12, vol = 0.12, slideTo = null) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

      try {

        if (raw) {
          return Object.assign({}, defaultState, JSON.parse(raw));
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));

      try {

      if (count >= 6) return { title: '南昌星港 · 传奇总工程师', badge: '👑' };

            <circle cx="140" cy="128" r="16" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>

        <!-- 4. RIGHT ARM - Viewer Left (粒子脉冲集束臂) -->
        <g id="svg-part-rightArm">
          ${has('rightArm') ? `

            <rect x="62" y="152" width="32" height="36" rx="6" fill="${liv.primary}" stroke="#F8FAFC" stroke-width="1.4"/>
            <circle cx="78" cy="186" r="8" fill="#0F172A" stroke="${liv.glow}" stroke-width="2"/>
            <circle class="reactor-glow" cx="78" cy="186" r="4.5" fill="${liv.glow}"/>
          ` : `
            <rect x="64" y="94" width="30" height="92" rx="6" fill="${wireFill}" stroke="${wireStroke}" stroke-dasharray="4 3"/>

        <!-- 5. LEFT ARM - Viewer Right (赣江矩阵激光盾) -->
        <g id="svg-part-leftArm">
          ${has('leftArm') ? `

            <rect x="190" y="122" width="22" height="42" rx="5" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/>
            <!-- Energy Shield -->
            <polygon points="204,108 238,118 232,192 204,204 196,156" fill="${liv.primary}" stroke="#F8FAFC" stroke-width="1.5"/>
            <polygon points="210,120 230,126 226,182 210,190" fill="${liv.glow}" fill-opacity="0.38" stroke="${liv.glow}" stroke-width="1.2"/>
          ` : `
            <rect x="186" y="94" width="30" height="86" rx="6" fill="${wireFill}" stroke="${wireStroke}" stroke-dasharray="4 3"/>
            <polygon points="206,112 236,120 230,190 206,198" fill="${wireFill}" stroke="${wireStroke}" stroke-dasharray="4 3"/>
          `}
        </g>

        <!-- 6. HEAD (星耀指挥官头冠) -->
        <g id="svg-part-head">
          ${has('head') ? `
            <rect x="122" y="54" width="36" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
            <!-- Visor Eyes -->
            <polygon points="126,70 138,73 138,78 126,76" fill="${liv.glow}"/>
            <polygon points="154,70 142,73 142,78 154,76" fill="${liv.glow}"/>
            <!-- V-Fin Antenna Crest -->
            <polygon points="140,62 104,34 114,48 140,68 166,48 176,34" fill="${liv.secondary}" stroke="#FEF08A" stroke-width="1"/>

            <rect x="122" y="54" width="36" height="36" rx="7" fill="${wireFill}" stroke="${wireStroke}" stroke-dasharray="4 3"/>

          `}
        </g>
      </svg>`;
    }

    /* =========================================================================
       4. MAIN VIEW ROUTER
       ========================================================================= */
    function render() {
      updateHeaderUI();
      const vp = document.getElementById('main-viewport');

      if (missionRuntime.activeSectorId) {
        document.getElementById('bottom-nav').classList.add('hidden');
        vp.classList.remove('pb-24');
        vp.classList.add('pb-6');
        vp.innerHTML = renderActiveStageView();
        return;
      } else {
        document.getElementById('bottom-nav').classList.remove('hidden');
        vp.classList.add('pb-24');
        vp.classList.remove('pb-6');
      }

      if (state.activeTab === 'missions') {
        vp.innerHTML = renderMissionsTab();
      } else if (state.activeTab === 'hangar') {
        vp.innerHTML = renderHangarTab();
      } else if (state.activeTab === 'blitz') {
        vp.innerHTML = renderBlitzTab();
      } else if (state.activeTab === 'parent') {
        vp.innerHTML = renderParentTab();
      }
    }

    /* =========================================================================
       5. TAB 1: MISSIONS HUB (星际闯关 - 手机竖屏碎片双关制)
       ========================================================================= */
    function renderMissionsTab() {
      const unlockedCount = state.unlockedParts.length;
      const pct = Math.round((unlockedCount / 6) * 100);

      let cardsHtml = SECTORS.map((sec, idx) => {
        const s1Done = !!state.completedStages[sec.stages[0].id];
        const s2Done = !!state.completedStages[sec.stages[1].id];
        const allDone = s1Done && s2Done;
        const rewardNames = sec.rewards.map(r => `${MECHA_PARTS[r].icon} ${MECHA_PARTS[r].name}`).join(' + ');

        return `
          <div class="${allDone ? 'tac-panel border-[#10B981]/60' : 'tac-panel'} p-3.5 relative overflow-hidden">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] font-mono font-bold px-2 py-0.5 rounded bg-[#1D3154] text-[#38BDF8]">${sec.code}</span>
                  <span class="text-xs font-semibold text-[#FBBF24]">📍 ${sec.landmark}</span>
                </div>
                <h3 class="text-base font-extrabold text-[#F8FAFC] mt-1.5">${sec.title}</h3>
                <p class="text-xs text-[#CBD5E1] mt-0.5">🎯 奥数思维：${sec.topic}</p>
              </div>
              <div class="shrink-0 text-right">
                <span class="inline-block text-xs font-bold px-2 py-1 rounded-lg ${allDone ? 'bg-[#064E3B] text-[#34D399] border border-[#10B981]/50' : 'bg-[#1F3152] text-[#E2E8F0]'}">
                  ${allDone ? '✅ 已通关' : `${(s1Done ? 1 : 0) + (s2Done ? 1 : 0)} / 2 关`}
                </span>
              </div>
            </div>

            <div class="mt-2.5 pt-2.5 border-t border-[#233759] flex items-center justify-between gap-2">
              <div class="text-xs text-[#94A3B8] leading-snug">
                <div>掉落部件：<span class="text-[#FDE68A] font-semibold">${rewardNames}</span></div>
                <div class="text-[11px] text-[#64748B] mt-0.5">⏱️ ${sec.estTime} · ${sec.schoolLink}</div>
              </div>
              <button onclick="startSector('${sec.id}')" class="${allDone ? 'tac-btn-slate px-3.5 py-2 text-xs' : 'tac-btn-primary px-4 py-2 text-xs'} shrink-0">
                ${allDone ? '重温沙盘' : (s1Done ? '继续第2关' : '立即出击')}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <!-- Compact Mecha Status Banner -->
        <section class="tac-panel p-3.5 mb-3.5 flex items-center gap-3">
          <div class="w-20 h-20 shrink-0 rounded-xl bg-[#0B1426] border border-[#243A60] flex items-center justify-center p-1 overflow-hidden" onclick="switchTab('hangar')">
            ${renderMechaSVG(state.unlockedParts, state.livery, false)}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-[#38BDF8]">机甲合体进度</span>
              <span class="text-xs font-mono font-bold text-[#FBBF24]">${unlockedCount}/6 部件 (${pct}%)</span>
            </div>
            <div class="w-full h-2.5 bg-[#0B1324] rounded-full overflow-hidden border border-[#243A60] mt-1.5">
              <div class="h-full bg-gradient-to-r from-[#F59E0B] to-[#34D399] transition-all duration-500" style="width: ${Math.max(pct, 6)}%"></div>
            </div>
            <p class="text-xs text-[#CBD5E1] mt-2 leading-relaxed">
              ${unlockedCount === 0
                ? '👋 欢迎来到南昌瑶湖母港！任选下方星域，每次只需玩 2 关即可拼装新机甲部件！'
                : unlockedCount < 6
                  ? '🔥 状态极佳！继续探索星域，集齐 6 大核心部件唤醒终极形态！'
                  : '🏆 NCH-0791 已满配觉醒！可前往【机甲工坊】切换涂装或挑战【速算充能】！'}
            </p>
          </div>
        </section>

        <div class="flex items-center justify-between mb-2.5 px-0.5">
          <h2 class="text-sm font-extrabold text-[#F8FAFC] tracking-wide">🌌 南昌四大星域任务（每局2关）</h2>
          <span class="text-xs text-[#94A3B8]">点击即玩 · 零公式画图破冰</span>
        </div>

        <div class="space-y-3">
          ${cardsHtml}
        </div>
      `;
    }

    /* =========================================================================
       6. ACTIVE STAGE & INTERACTIVE VISUAL SANDBOXES
       ========================================================================= */
    function startSector(sectorId) {
      sfxTap();
      const sec = SECTORS.find(s => s.id === sectorId);
      if (!sec) return;
      const s1Done = !!state.completedStages[sec.stages[0].id];
      const s2Done = !!state.completedStages[sec.stages[1].id];
      const startIdx = (s1Done && !s2Done) ? 1 : 0;
      initStageRuntime(sectorId, startIdx);
      render();
    }

    function initStageRuntime(sectorId, stageIndex) {
      missionRuntime = {
        activeSectorId: sectorId,
        stageIndex: stageIndex,
        userInput: '',
        hintLevel: 0,
        feedbackMsg: '',
        feedbackType: '',
        legsUnits: [2, 2, 2, 2, 2, 2, 2, 2],
        legsInitialized: false,
        batteryUnits: [2, 2, 2, 2, 2, 2],
        cyclePacked: false,
        fleetExpanded: false,
        mainMultipleCount: 1,
        crystalsDistributed: false,
        diffCutApplied: false,
        perimSlideH: false,
        perimSlideV: false,
        treesPlanted: [true, false, false, false, false, false, false]
      };
    }

    function exitMission() {
      sfxTap();
      missionRuntime.activeSectorId = null;
      render();
    }

    function renderActiveStageView() {
      const sec = SECTORS.find(s => s.id === missionRuntime.activeSectorId);
      const stage = sec.stages[missionRuntime.stageIndex];

      return `
        <!-- Stage Top Header -->
        <div class="flex items-center justify-between mb-2.5">
          <button onclick="exitMission()" class="tac-btn-slate px-3 py-1.5 text-xs flex items-center gap-1">
            <span>←</span><span>返回星域</span>
          </button>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full ${missionRuntime.stageIndex === 0 ? 'bg-[#FBBF24]' : 'bg-[#10B981]'}"></span>
            <span class="text-xs font-bold text-[#E2E8F0]">${stage.badge}</span>
            <span class="w-2.5 h-2.5 rounded-full ${missionRuntime.stageIndex === 1 ? 'bg-[#FBBF24]' : 'bg-[#334155]'}"></span>
          </div>
          <button onclick="triggerRadarHint()" class="tac-btn-cyan px-2.5 py-1.5 text-xs flex items-center gap-1">
            <span>📡</span><span>提示(${missionRuntime.hintLevel}/3)</span>
          </button>
        </div>

        <!-- Story Briefing Card -->
        <div class="tac-panel p-3.5 mb-3">
          <div class="flex items-center justify-between text-xs text-[#38BDF8] font-bold mb-1">
            <span>📍 ${sec.landmark}</span>
            <span>${sec.topic}</span>
          </div>
          <p class="text-sm text-[#F8FAFC] leading-relaxed font-medium">${stage.story}</p>
        </div>

        <!-- Radar Hint Drawer (if requested) -->
        ${missionRuntime.hintLevel > 0 ? `
          <div class="mb-3 p-3 rounded-xl bg-[#0F2942] border border-[#38BDF8]/60 space-y-1.5 text-xs text-[#E0F2FE]">
            ${stage.hints.slice(0, missionRuntime.hintLevel).map(h => `<div class="leading-relaxed">${h}</div>`).join('')}
          </div>
        ` : ''}

        <!-- Interactive Visual Sandbox -->
        <div class="tac-panel p-3.5 mb-3">
          ${renderStageSandbox(stage)}
        </div>

        <!-- Feedback Banner -->
        ${missionRuntime.feedbackMsg ? `
          <div class="mb-3 px-3.5 py-2.5 rounded-xl text-xs font-bold leading-relaxed border ${
            missionRuntime.feedbackType === 'ok'
              ? 'bg-[#064E3B] border-[#10B981] text-[#A7F3D0]'
              : 'bg-[#3B2314] border-[#F59E0B] text-[#FDE68A]'
          }">
            ${missionRuntime.feedbackMsg}
          </div>
        ` : ''}

        <!-- Answer Input Area (Choice Buttons OR Custom Thumb Numpad) -->
        ${stage.choices ? renderChoicePad(stage) : renderThumbNumpad(stage)}
      `;
    }

    function renderStageSandbox(stage) {
      switch (stage.type) {
        case 'sandbox_legs': {
          const totalLegs = missionRuntime.legsInitialized
            ? missionRuntime.legsUnits.reduce((a, b) => a + b, 0)
            : 0;
          const remain = 22 - totalLegs;
          const beastCount = missionRuntime.legsUnits.filter(x => x === 4).length;

          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">🛠️ 战术沙盘：点击机甲切换 2腿 / 4腿</span>
              <button onclick="activateTwoLegMode()" class="px-2.5 py-1 rounded-lg text-xs font-bold ${missionRuntime.legsInitialized ? 'bg-[#065F46] text-[#A7F3D0]' : 'bg-[#F59E0B] text-[#0B1220]'}">
                ${missionRuntime.legsInitialized ? '已按双足就位' : '① 启动全员双足'}
              </button>
            </div>

            <div class="grid grid-cols-4 gap-2 my-2.5">
              ${missionRuntime.legsUnits.map((legs, idx) => {
                const isFour = missionRuntime.legsInitialized && legs === 4;
                const isTwo = missionRuntime.legsInitialized && legs === 2;
                return `
                  <button onclick="toggleMechaUnitLegs(${idx})" class="p-2 rounded-xl border text-center transition-all active:scale-95 ${
                    !missionRuntime.legsInitialized
                      ? 'bg-[#0D1729] border-[#263B61] text-[#64748B]'
                      : isFour
                        ? 'bg-[#3B2314] border-[#FBBF24] text-[#FDE68A]'
                        : 'bg-[#12263F] border-[#38BDF8]/60 text-[#BAE6FD]'
                  }">
                    <div class="text-xl leading-none">${!missionRuntime.legsInitialized ? '❔' : (isFour ? '🦏' : '🤖')}</div>
                    <div class="text-[11px] font-bold mt-1">${!missionRuntime.legsInitialized ? `${idx+1}号舱` : (isFour ? '4条腿' : '2条腿')}</div>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="px-3 py-2 rounded-lg bg-[#0B1324] border border-[#23385C] flex items-center justify-between text-xs">
              <span>已装腿数：<strong class="text-[#38BDF8] font-mono">${totalLegs}</strong> / 22条</span>
              <span class="${remain === 0 ? 'text-[#34D399] font-extrabold' : 'text-[#FBBF24] font-bold'}">
                ${!missionRuntime.legsInitialized
                  ? '请先点右上角启动全员双足'
                  : remain === 0
                    ? `✅ 刚好22条！四足兽 = ${beastCount}台`
                    : remain > 0
                      ? `还剩 ${remain} 条腿待加装`
                      : `超出了 ${Math.abs(remain)} 条腿，点1台收起`}
              </span>
            </div>
          `;
        }

        case 'sandbox_battery': {
          const totalPower = missionRuntime.batteryUnits.reduce((a, b) => a + b, 0);
          const diff = 21 - totalPower;
          const fiveCount = missionRuntime.batteryUnits.filter(x => x === 5).length;

          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">🔋 电池模拟槽（默认全按2格电算 = 12格）</span>
              <span class="text-xs text-[#94A3B8]">点击电池升级为5格电</span>
            </div>
            <div class="grid grid-cols-6 gap-1.5 my-2">
              ${missionRuntime.batteryUnits.map((val, idx) => `
                <button onclick="toggleBatteryUnit(${idx})" class="py-2.5 px-1 rounded-xl border text-center active:scale-95 ${
                  val === 5
                    ? 'bg-[#064E3B] border-[#34D399] text-[#A7F3D0]'
                    : 'bg-[#12263F] border-[#38BDF8]/50 text-[#BAE6FD]'
                }">
                  <div class="text-base leading-none">${val === 5 ? '⚡' : '🔋'}</div>
                  <div class="text-xs font-mono font-extrabold mt-1">${val}格</div>
                </button>
              `).join('')}
            </div>
            <div class="px-3 py-2 rounded-lg bg-[#0B1324] border border-[#23385C] flex items-center justify-between text-xs">
              <span>当前总电量：<strong class="text-[#38BDF8] font-mono">${totalPower}</strong> / 21格</span>
              <span class="${diff === 0 ? 'text-[#34D399] font-extrabold' : 'text-[#FBBF24] font-bold'}">
                ${diff === 0 ? `✅ 电量吻合！五核电池 = ${fiveCount}块` : (diff > 0 ? `还差 ${diff} 格电（每升1块+3格）` : `超出 ${Math.abs(diff)} 格电`)}
              </span>
            </div>
          `;
        }

        case 'sandbox_cycle_wheel': {
          const icons = ['🔥', '⚡', '🛡️', '🌿'];
          const bgCls = [
            'bg-rose-950/70 border-rose-500/60 text-rose-200',
            'bg-sky-950/70 border-sky-500/60 text-sky-200',
            'bg-amber-950/70 border-amber-400 text-amber-200',
            'bg-emerald-950/70 border-emerald-500/60 text-emerald-200'
          ];

          return `
            <div class="flex items-center justify-between mb-2.5">
              <span class="text-xs font-extrabold text-[#FBBF24]">🎡 南昌之星 1～19 号能量舱</span>
              <button onclick="toggleCyclePack()" class="px-3 py-1 rounded-lg text-xs font-bold ${missionRuntime.cyclePacked ? 'bg-[#065F46] text-[#A7F3D0]' : 'bg-[#F59E0B] text-[#0B1220]'}">
                ${missionRuntime.cyclePacked ? '✅ 已按4个一组打包' : '📦 每4舱打包成组'}
              </button>
            </div>

            ${!missionRuntime.cyclePacked ? `
              <div class="grid grid-cols-8 gap-1.5 text-center my-2">
                ${Array.from({ length: 19 }, (_, i) => {
                  const num = i + 1;
                  const known = num <= 6;
                  return `
                    <div class="py-1.5 rounded-lg border text-xs font-mono ${known ? bgCls[i % 4] : 'bg-[#0D1729] border-[#263B61] text-[#94A3B8]'}">
                      <div>${known ? icons[i % 4] : '❔'}</div>
                      <div class="text-[10px]">#${num}</div>
                    </div>
                  `;
                }).join('')}
              </div>
              <p class="text-xs text-[#94A3B8] mt-1.5">点击右上角【每4舱打包成组】，看看19号落在余数第几个！</p>
            ` : `
              <div class="grid grid-cols-4 gap-1.5 my-2">
                ${[1, 2, 3, 4].map(g => `
                  <div class="p-2 rounded-lg bg-[#10233D] border border-[#2F5282] text-center">
                    <div class="text-[11px] font-bold text-[#38BDF8]">第 ${g} 箱</div>
                    <div class="text-xs mt-0.5">🔥⚡🛡️🌿</div>
                    <div class="text-[10px] text-[#94A3B8] font-mono">#${(g-1)*4+1}~#${g*4}</div>
                  </div>
                `).join('')}
              </div>
              <div class="p-2.5 rounded-xl bg-[#1E293B] border border-[#FBBF24] flex items-center justify-between">
                <div class="text-xs">
                  <div class="font-bold text-[#FDE68A]">19 ÷ 4 = 4箱 …… 余3个舱：</div>
                  <div class="text-[#CBD5E1] mt-0.5">数余下的3个：#17🔥 → #18⚡ → <strong class="text-[#FBBF24]">#19🛡️</strong></div>
                </div>
                <div class="flex gap-1.5">
                  <span class="px-2 py-1 rounded bg-rose-950 border border-rose-500 text-xs">#17🔥</span>
                  <span class="px-2 py-1 rounded bg-sky-950 border border-sky-500 text-xs">#18⚡</span>
                  <span class="px-2 py-1 rounded bg-amber-900 border-2 border-amber-400 text-xs font-extrabold">#19🛡️</span>
                </div>
              </div>
            `}
          `;
        }

        case 'sandbox_fleet_cycle': {
          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">🛸 巡逻编队（每组：1先锋 + 2护卫 + 2支援 = 5台）</span>
              <button onclick="toggleFleetMatrix()" class="px-2.5 py-1 rounded-lg text-xs font-bold ${missionRuntime.fleetExpanded ? 'bg-[#065F46] text-[#A7F3D0]' : 'bg-[#F59E0B] text-[#0B1220]'}">
                ${missionRuntime.fleetExpanded ? '已展开编队' : '展开22台矩阵'}
              </button>
            </div>

            ${!missionRuntime.fleetExpanded ? `
              <div class="p-3 rounded-xl bg-[#0B1324] border border-[#23385C] flex items-center justify-around text-xs">
                <span class="px-2 py-1 rounded bg-[#1E293B] text-[#94A3B8]">🚀 先锋×1</span>
                <span class="px-2.5 py-1 rounded bg-[#3B2314] border border-[#FBBF24] text-[#FDE68A] font-bold">🛡️ 护卫×2</span>
                <span class="px-2 py-1 rounded bg-[#1E293B] text-[#94A3B8]">🔧 支援×2</span>
              </div>
              <p class="text-xs text-[#94A3B8] mt-2">先自己心算 22 ÷ 5 有几组余几台，或点击右上角【展开22台矩阵】验证！</p>
            ` : `
              <div class="space-y-1.5 my-1.5 text-xs font-mono">
                ${[1, 2, 3, 4].map(row => `
                  <div class="flex items-center justify-between px-2.5 py-1 rounded bg-[#0D182C] border border-[#22385E]">

    /* Sandbox Interaction Handlers */
    function activateTwoLegMode() {
      sfxMechSwitch();

      render();

    function toggleMechaUnitLegs(idx) {
      sfxMechSwitch();
      if (!missionRuntime.legsInitialized) {
        missionRuntime.legsInitialized = true;
      }
      missionRuntime.legsUnits[idx] = missionRuntime.legsUnits[idx] === 2 ? 4 : 2;
      render();
    }

    function toggleBatteryUnit(idx) {
      sfxMechSwitch();
      missionRuntime.batteryUnits[idx] = missionRuntime.batteryUnits[idx] === 2 ? 5 : 2;
      render();
    }

    function toggleCyclePack() {
      sfxMechSwitch();
      missionRuntime.cyclePacked = !missionRuntime.cyclePacked;
      render();
    }

    function toggleFleetMatrix() {
      sfxMechSwitch();
      missionRuntime.fleetExpanded = !missionRuntime.fleetExpanded;
      render();
    }

    function adjustMultiple(delta) {
      sfxMechSwitch();
      const next = Math.min(5, Math.max(1, missionRuntime.mainMultipleCount + delta));
      missionRuntime.mainMultipleCount = next;
      missionRuntime.crystalsDistributed = false;
      render();
    }

    function distributeCrystals() {
      sfxSuccess();
      missionRuntime.crystalsDistributed = true;
      render();
    }

    function toggleDiffCut() {
      sfxMechSwitch();
      missionRuntime.diffCutApplied = !missionRuntime.diffCutApplied;
      render();
    }

    function slidePerim(axis) {
      sfxMechSwitch();
      if (axis === 'H') missionRuntime.perimSlideH = !missionRuntime.perimSlideH;
      if (axis === 'V') missionRuntime.perimSlideV = !missionRuntime.perimSlideV;
      render();
    }

      sfxMechSwitch();
      missionRuntime.treesPlanted[idx] = !missionRuntime.treesPlanted[idx];
      render();
    }

    function plantAllTowers() {
      sfxMechSwitch();
      missionRuntime.treesPlanted = [true, true, true, true, true, true, true];
      render();
    }

    function triggerRadarHint() {
      sfxHint();
      if (missionRuntime.hintLevel < 3) {
        missionRuntime.hintLevel += 1;
        state.hintsUsedCount += 1;
        saveState();
      }
      render();

    /* Custom Choice Pad & Thumb Numpad */
    function renderChoicePad(stage) {
      return `
        <div class="tac-panel p-3.5">
          <div class="text-xs font-bold text-[#CBD5E1] mb-2.5">${stage.questionShort}</div>
          <div class="grid grid-cols-2 gap-2.5">
            ${stage.choices.map(c => `
              <button onclick="submitChoice('${c.val}')" class="py-3 px-3 rounded-xl border-2 font-extrabold text-sm active:scale-95 transition-transform ${c.color}">
                ${c.label}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderThumbNumpad(stage) {
      return `
        <div class="tac-panel p-3">
          <div class="flex items-center justify-between mb-2.5 px-1">
            <span class="text-xs font-bold text-[#CBD5E1]">${stage.questionShort}</span>
            <div class="flex items-center gap-1.5">
              <div class="min-w-[84px] h-9 px-3 rounded-lg bg-[#09101E] border-2 border-[#38BDF8] flex items-center justify-center font-mono text-lg font-extrabold text-[#FBBF24]">
                ${missionRuntime.userInput || '?'}
              </div>
              <span class="text-xs font-bold text-[#94A3B8]">${stage.unit || ''}</span>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-2">
            ${['1','2','3','⌫','4','5','6','清空','7','8','9','0'].map(key => {
              if (key === '⌫') {
                return `<button onclick="pressKey('BACK')" class="numpad-key text-sm text-[#FDA4AF]">⌫ 退格</button>`;
              }
              if (key === '清空') {
                return `<button onclick="pressKey('CLR')" class="numpad-key text-xs text-[#94A3B8]">清空</button>`;
              }
              return `<button onclick="pressKey('${key}')" class="numpad-key">${key}</button>`;
            }).join('')}
          </div>

          <button onclick="submitAnswer()" class="tac-btn-primary w-full py-3 mt-2.5 text-sm tracking-wide">
            🚀 确认发射校准能量
          </button>
        </div>
      `;
    }

    function pressKey(k) {
      sfxTap();
      if (k === 'BACK') {
        missionRuntime.userInput = missionRuntime.userInput.slice(0, -1);
      } else if (k === 'CLR') {
        missionRuntime.userInput = '';
      } else if (missionRuntime.userInput.length < 4) {
        missionRuntime.userInput += k;
      }
      render();
    }

    function submitChoice(val) {
      missionRuntime.userInput = val;
      submitAnswer();
    }

    function submitAnswer() {
      const sec = SECTORS.find(s => s.id === missionRuntime.activeSectorId);
      const stage = sec.stages[missionRuntime.stageIndex];
      const cleaned = String(missionRuntime.userInput).trim();

      if (!cleaned) {
        sfxRecalibrate();
        missionRuntime.feedbackType = 'warn';
        missionRuntime.feedbackMsg = '🛰️ 机甲副官：请先用下方数字键输入校准数值哦！';
        render();
        return;
      }

      if (cleaned === stage.answer) {
        sfxSuccess();
        const firstTime = !state.completedStages[stage.id];
        state.completedStages[stage.id] = true;
        if (firstTime) {
          state.crystals += 40;
        }
        saveState();

        if (missionRuntime.stageIndex === 0) {
          // Stage 1 cleared -> Show crisp modal leading right into Stage 2!
          showModal(`
            <div class="text-4xl mb-2">🎯</div>
            <h3 class="text-lg font-extrabold text-[#34D399]">第 1 关校准成功！</h3>
            <p class="text-xs text-[#E2E8F0] mt-2 leading-relaxed text-left bg-[#0D1729] p-3 rounded-xl border border-[#243B61]">
              ${stage.successNote}
            </p>
            <div class="text-xs font-bold text-[#FBBF24] mt-3">${firstTime ? '+40 💎 超导晶石' : '思维模型再次巩固！'}</div>
            <button onclick="proceedToStageTwo()" class="tac-btn-primary w-full py-3 mt-4 text-sm">
              ⚡ 趁热打铁：进入第2关（最后1题！）
            </button>
          `);
        } else {
          // Sector cleared! Unlock Mecha Part(s)!
          state.sessionsCompleted += 1;
          let newlyUnlocked = [];
          sec.rewards.forEach(partId => {
            if (!state.unlockedParts.includes(partId)) {
              state.unlockedParts.push(partId);
              newlyUnlocked.push(partId);
            }
          });
          if (newlyUnlocked.length > 0) {
            state.hasNewPartBadge = true;
            setTimeout(() => sfxUnlockPart(), 200);
          }
          saveState();

          const partBadges = sec.rewards.map(pid => {
            const p = MECHA_PARTS[pid];
            return `<div class="px-3 py-2 rounded-xl bg-[#162847] border border-[#FBBF24] flex items-center gap-2 text-left">
              <span class="text-2xl">${p.icon}</span>
              <div>
                <div class="text-xs font-extrabold text-[#FDE68A]">${p.name}</div>
                <div class="text-[11px] text-[#94A3B8]">${p.desc}</div>
              </div>
            </div>`;
          }).join('');

          const allSix = state.unlockedParts.length === 6;

          showModal(`
            <div class="text-4xl mb-1">${allSix ? '👑' : '🛠️'}</div>
            <h3 class="text-lg font-extrabold text-[#FBBF24]">
              ${allSix ? '洪都·星耀号 NCH-0791 全装觉醒！' : `${sec.landmark} · 双关攻克！`}
            </h3>
            <p class="text-xs text-[#CBD5E1] mt-1.5 leading-relaxed text-left bg-[#0D1729] p-2.5 rounded-xl border border-[#243B61]">
              ${stage.successNote}
            </p>
            <div class="mt-3 space-y-2">
              <div class="text-xs font-bold text-[#38BDF8]">🎁 已挂载机甲核心部件：</div>
              ${partBadges}
            </div>
            <div class="grid grid-cols-2 gap-2 mt-4">
              <button onclick="closeModalAndGo('missions')" class="tac-btn-slate py-2.5 text-xs">返回星域地图</button>
              <button onclick="closeModalAndGo('hangar')" class="tac-btn-primary py-2.5 text-xs">🤖 去工坊看新机甲</button>
            </div>
          `);
        }
      } else {
        // Gentle non-punishing engineering calibration message
        sfxRecalibrate();
        missionRuntime.feedbackType = 'warn';
        if (missionRuntime.hintLevel === 0) {
          missionRuntime.hintLevel = 1;
        }
        missionRuntime.feedbackMsg = `🔧 能量读数（${cleaned}）还差一点点吻合！别急，已为你开启上方【📡 战术雷达扫描】，动手点一点沙盘就能发现玄机！`;
        missionRuntime.userInput = '';
        render();
      }
    }

    function proceedToStageTwo() {
      sfxTap();
      hideModal();
      initStageRuntime(missionRuntime.activeSectorId, 1);
      render();
    }

    function showModal(innerHtml) {
      document.getElementById('modal-box').innerHTML = innerHtml;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function closeModalAndGo(tab) {
      sfxTap();
      hideModal();
      missionRuntime.activeSectorId = null;
      state.activeTab = tab;
      if (tab === 'hangar') state.hasNewPartBadge = false;
      saveState();
      render();
    }

        const active = state.livery === liv.id;
        return `
          <button onclick="selectLivery('${liv.id}')" class="p-2 rounded-xl border text-center transition-all ${
            active ? 'bg-[#1F3358] border-[#FBBF24]' : 'bg-[#111D33] border-[#253B63]'
          }">
            <div class="flex items-center justify-center gap-1 mb-1">
              <span class="w-3 h-3 rounded-full" style="background:${liv.primary}"></span>
              <span class="w-3 h-3 rounded-full" style="background:${liv.secondary}"></span>
            </div>
            <div class="text-xs font-bold text-[#F8FAFC]">${liv.name}</div>
            <div class="text-[10px] text-[#94A3B8]">${liv.sub}</div>
          </button>
        `;
      }).join('');

      return `
        <section class="tac-panel p-4 relative overflow-hidden">
          <div class="flex items-center justify-between mb-1">
            <div>
              <span class="text-[11px] font-mono text-[#38BDF8]">HANGAR BAY // YAOHU-0791</span>
              <h2 class="text-base font-extrabold text-[#F8FAFC]">洪都·星耀号 机甲总装台</h2>
            </div>
            <button onclick="togglePreviewFull()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border ${
              state.previewFullMecha
                ? 'bg-[#3B2314] border-[#FBBF24] text-[#FDE68A]'
                : 'bg-[#15243E] border-[#2E4A7A] text-[#CBD5E1]'
            }">
              ${state.previewFullMecha ? '👁️ 退出满配预览' : '👁️ 预览满配形态'}
            </button>
          </div>

          <div class="my-2 py-2 rounded-2xl bg-[#09101E] border border-[#1E3256] relative">
            ${renderMechaSVG(displayParts, state.livery, state.boostActive)}
            <div class="text-center mt-1">
              <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#13223B] text-[#94A3B8] border border-[#243B63]">
                ${state.previewFullMecha ? '当前为满配设计蓝图预览模式' : `已实装部件：${state.unlockedParts.length} / 6`}
              </span>
            </div>
          </div>

          <button onclick="triggerMechaBoost()" class="tac-btn-primary w-full py-2.5 mt-2 text-xs">
            🔥 点火测试：启动星耀推进演出
          </button>
        </section>

        <!-- Paint Liveries -->
        <section class="mt-3.5">
          <h3 class="text-xs font-extrabold text-[#CBD5E1] mb-2 px-0.5">🎨 专属机甲涂装切换（免费解锁）</h3>
          <div class="grid grid-cols-3 gap-2">
            ${liveryBtns}
          </div>
        </section>

        <!-- 6 Modular Parts List -->
        <section class="mt-3.5">
          <h3 class="text-xs font-extrabold text-[#CBD5E1] mb-2 px-0.5">🔩 六大模块化装甲部件清单</h3>
          <div class="grid grid-cols-2 gap-2">
            ${partCards}
          </div>
        </section>
      `;
    }

    function selectLivery(id) {
      sfxMechSwitch();
      state.livery = id;
      saveState();
      render();
    }

    function togglePreviewFull() {
      sfxTap();
      state.previewFullMecha = !state.previewFullMecha;
      saveState();
      render();
    }

    function triggerMechaBoost() {
      sfxUnlockPart();
      state.boostActive = true;
      render();
      setTimeout(() => {
        state.boostActive = false;
        if (state.activeTab === 'hangar') render();
      }, 2400);
    }

    /* =========================================================================
       8. TAB 3: 60-SECOND CLEVER CALCULATION BLITZ (速算充能舱)
       ========================================================================= */
    function renderBlitzTab() {
      if (!blitzRuntime.running) {
        return `
          <section class="tac-panel p-4 text-center">
            <div class="text-4xl mb-2">⚡</div>
            <h2 class="text-lg font-extrabold text-[#F8FAFC]">60秒 凑整巧算充能舱</h2>
            <p class="text-xs text-[#CBD5E1] mt-1.5 leading-relaxed">
              三年级奥数计算核心不是“硬列竖式死算”，而是练就一双能瞬间发现<strong class="text-[#FBBF24]">“好朋友数（25×4、125×8、凑整百）”</strong>的火眼金睛！
            </p>

            <div class="grid grid-cols-2 gap-2.5 my-4">
              <div class="p-3 rounded-xl bg-[#0C1526] border border-[#22385E]">
                <div class="text-xs text-[#94A3B8]">历史最高充能</div>
                <div class="text-xl font-mono font-extrabold text-[#34D399] mt-0.5">${state.blitzBestScore} 分</div>
              </div>
              <div class="p-3 rounded-xl bg-[#0C1526] border border-[#22385E]">
                <div class="text-xs text-[#94A3B8]">单局时长</div>
                <div class="text-xl font-mono font-extrabold text-[#38BDF8] mt-0.5">60 秒</div>
              </div>
            </div>

            <div class="text-left p-3 rounded-xl bg-[#0F223A] border border-[#2B4C7E] text-xs text-[#BAE6FD] space-y-1 mb-4">
              <div class="font-bold text-[#FDE68A]">💡 机甲师三大巧算口诀：</div>
              <div>1. 接近整百先凑整：<code class="text-white">198 + 57 = 200 + 57 - 2</code></div>
              <div>2. 乘法王牌好搭档：<code class="text-white">25 × 4 = 100</code>，<code class="text-white">125 × 8 = 1000</code></div>
              <div>3. 尾巴互补先牵手：<code class="text-white">46 + 79 + 54 = (46+54) + 79</code></div>
            </div>

            <button onclick="startBlitzGame()" class="tac-btn-primary w-full py-3.5 text-sm">
              ⚡ 启动 60 秒反应堆充能
            </button>
          </section>
        `;
      }

      const q = BLITZ_QUESTIONS[blitzRuntime.qIndex % BLITZ_QUESTIONS.length];
      return `
        <section class="tac-panel p-4">
          <div class="flex items-center justify-between text-xs font-bold mb-3">
            <span class="px-2.5 py-1 rounded-lg bg-[#0D182C] border border-[#294370] text-[#38BDF8] font-mono">
              ⏱️ 剩余 ${blitzRuntime.timeLeft}s
            </span>
            <span class="text-[#FBBF24] font-mono text-sm">🔥 连击 ×${blitzRuntime.streak}</span>
            <span class="px-2.5 py-1 rounded-lg bg-[#064E3B] text-[#34D399] font-mono">
              得分 ${blitzRuntime.score}
            </span>
          </div>

          <div class="py-6 px-3 rounded-2xl bg-[#09101E] border-2 border-[#2A4575] text-center my-2">
            <div class="text-xs text-[#94A3B8] mb-1">心算巧算下面算式：</div>
            <div class="text-3xl font-mono font-extrabold text-[#F8FAFC] tracking-wider">${q.expr} = ?</div>
          </div>

          <div class="p-2.5 rounded-xl bg-[#0F243D] border border-[#2C5282] text-xs text-[#BAE6FD] my-3">
            💡 <strong>巧算芯片提示：</strong>${q.tip}
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            ${q.options.map(opt => `
              <button onclick="answerBlitz('${opt}')" class="tac-btn-slate py-3.5 text-lg font-mono font-extrabold active:scale-95">
                ${opt}
              </button>
            `).join('')}
          </div>
        </section>
      `;
    }

    function startBlitzGame() {
      sfxTap();
      blitzRuntime = {
        running: true,
        timeLeft: 60,
        score: 0,
        streak: 0,
        qIndex: Math.floor(Math.random() * BLITZ_QUESTIONS.length),
        lastTip: '',
        timerId: null
      };
      blitzRuntime.timerId = setInterval(() => {
        blitzRuntime.timeLeft -= 1;
        if (blitzRuntime.timeLeft <= 0) {
          finishBlitzGame();
        } else if (state.activeTab === 'blitz') {
          render();
        }
      }, 1000);
      render();
    }

    function answerBlitz(choice) {
      const q = BLITZ_QUESTIONS[blitzRuntime.qIndex % BLITZ_QUESTIONS.length];
      if (choice === q.ans) {
        sfxSuccess();
        blitzRuntime.streak += 1;
        blitzRuntime.score += 10 + Math.min(blitzRuntime.streak * 2, 10);
      } else {
        sfxRecalibrate();
        blitzRuntime.streak = 0;
      }
      blitzRuntime.qIndex += 1;
      render();
    }

    function finishBlitzGame() {
      if (blitzRuntime.timerId) {
        clearInterval(blitzRuntime.timerId);
        blitzRuntime.timerId = null;
      }
      blitzRuntime.running = false;
      const earned = Math.max(15, Math.round(blitzRuntime.score / 2));
      state.crystals += earned;
      if (blitzRuntime.score > state.blitzBestScore) {
        state.blitzBestScore = blitzRuntime.score;
      }
      saveState();
      sfxUnlockPart();
      showModal(`
        <div class="text-4xl mb-2">⚡</div>
        <h3 class="text-lg font-extrabold text-[#FBBF24]">充能完毕！得分 ${blitzRuntime.score}</h3>
        <p class="text-xs text-[#CBD5E1] mt-2">巧算反应速度超棒！已转化为机甲能源奖励：<strong class="text-[#34D399]">+${earned} 💎</strong></p>
        <button onclick="hideModal(); render();" class="tac-btn-primary w-full py-2.5 mt-4 text-xs">收下晶石</button>
      `);
      render();
    }

    /* =========================================================================
       9. TAB 4: COMMANDER ARCHIVE / PARENT INSIGHTS (家长指挥档案)
       ========================================================================= */
    function renderParentTab() {
      const sDone = Object.keys(state.completedStages).length;
      const dims = [
        { label: '逻辑假设（鸡兔同笼）', pct: state.completedStages['s1_2'] ? 95 : (state.completedStages['s1_1'] ? 65 : 30) },
        { label: '周期规律（余数分组）', pct: state.completedStages['s2_2'] ? 95 : (state.completedStages['s2_1'] ? 65 : 30) },
        { label: '画图建模（和差倍图）', pct: state.completedStages['s3_2'] ? 95 : (state.completedStages['s3_1'] ? 65 : 30) },
        { label: '空间转化（周长与间隔）', pct: state.completedStages['s4_2'] ? 95 : (state.completedStages['s4_1'] ? 65 : 30) },
        { label: '数感巧算（凑整好朋友）', pct: Math.min(98, 35 + Math.round(state.blitzBestScore / 2)) }
      ];

      return `
        <section class="tac-panel p-4 mb-3.5">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-base font-extrabold text-[#F8FAFC]">📊 少年机甲师思维档案（家长舱）</h2>
            <span class="text-xs px-2 py-0.5 rounded bg-[#1A2E4C] text-[#38BDF8]">三年级 · 南昌版</span>
          </div>
          <p class="text-xs text-[#94A3B8] leading-relaxed">
            这里记录孩子的奥数思维点亮轨迹。刚接触奥数阶段，建议<strong class="text-[#FBBF24]">每天碎片时间只玩 1～2 个星域（约 5 分钟）</strong>，在孩子最有成就感时“见好就收”，他明天才会主动惦记着来闯关！
          </p>

          <div class="grid grid-cols-3 gap-2 my-3 text-center">
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C]">
              <div class="text-lg font-mono font-extrabold text-[#34D399]">${sDone}/8</div>
              <div class="text-[11px] text-[#94A3B8]">已通关卡</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C]">
              <div class="text-lg font-mono font-extrabold text-[#FBBF24]">${state.unlockedParts.length}/6</div>
              <div class="text-[11px] text-[#94A3B8]">机甲部件</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C]">
              <div class="text-lg font-mono font-extrabold text-[#38BDF8]">${state.hintsUsedCount}次</div>
              <div class="text-[11px] text-[#94A3B8]">雷达辅助</div>
            </div>
          </div>

          <div class="space-y-2.5 mt-3">
            ${dims.map(d => `
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-[#E2E8F0] font-semibold">${d.label}</span>
                  <span class="font-mono text-[#38BDF8]">${d.pct}%</span>
                </div>
                <div class="h-2 rounded-full bg-[#0B1324] overflow-hidden border border-[#22375B]">
                  <div class="h-full bg-gradient-to-r from-[#0EA5E9] to-[#34D399]" style="width:${d.pct}%"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>

        <section class="tac-panel p-4 space-y-2.5">
          <h3 class="text-xs font-extrabold text-[#CBD5E1]">🛠️ 家长调试与交付工具</h3>
          <p class="text-xs text-[#94A3B8] leading-relaxed">
            您可以先点击“一键解锁全机甲”体验所有特效，在把手机交给孩子正式玩之前，点“重置为新兵初始状态”即可。
          </p>
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button onclick="unlockAllDemo()" class="tac-btn-cyan py-2.5 text-xs">✨ 一键满配演示</button>
            <button onclick="resetProgressClean()" class="tac-btn-slate py-2.5 text-xs text-[#FDA4AF]">🔄 重置给孩子重玩</button>
          </div>
        </section>
      `;
    }

    function unlockAllDemo() {
      sfxUnlockPart();
      state.unlockedParts = Object.keys(MECHA_PARTS);
      SECTORS.forEach(s => s.stages.forEach(st => { state.completedStages[st.id] = true; }));
      state.crystals = 520;
      state.hasNewPartBadge = true;
      saveState();
      render();
    }

    function resetProgressClean() {
      sfxTap();
      state = JSON.parse(JSON.stringify(defaultState));
      state.activeTab = 'missions';
      saveState();
      render();
    }

    // Unlock iOS Safari WebAudio on first touch
    document.addEventListener('touchstart', function() { getAudioCtx(); }, { once: true, passive: true });
    // Boot Application
    render();
  </script>
</body>
</html>
