    let soundEnabled = true;

    let audioCtx = null;

    function getAudioCtx() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.12, vol = 0.12, slideTo = null) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function sfxMechSwitch() { playTone(260, 'sawtooth', 0.11, 0.08, 440); }

    // Chinese TTS Read-Aloud Engine
    function cleanTextForSpeech(txt) {
      return String(txt || '')
        .replace(/[🔥⚡🛡️🌿🚀🤖🦿🪽🦾🔰👑📡🛠️💡🎯🛸📊📐🗼✂️➕✅❌❔💎👾⚔️]/g, '')
        .replace(/×/g, '乘')
        .replace(/÷/g, '除以')
        .replace(/\+/g, '加')
        .replace(/=/g, '等于')
        .replace(/NCH-0791/g, '星耀零七九一号');
    }

    function speakText(rawText) {
      sfxTap();
      if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
        alert('当前浏览器环境暂不支持系统语音朗读，建议使用 Safari / Edge / Chrome 打开。');
        return;
      }
      if (speakingNow) {
        stopSpeech();
        render();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(cleanTextForSpeech(rawText));
        utter.lang = 'zh-CN';
        utter.rate = 0.96;
        utter.pitch = 1.05;
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const zhVoice = voices.find(v => v.lang && v.lang.indexOf('zh') === 0);
        if (zhVoice) utter.voice = zhVoice;
        speakingNow = true;
        utter.onend = () => { speakingNow = false; render(); };
        utter.onerror = () => { speakingNow = false; render(); };
        window.speechSynthesis.speak(utter);
        render();
      } catch (e) {
        speakingNow = false;
      }
    }

    function stopSpeech() {
      speakingNow = false;
      try {
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function pickOne(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

  return {
    topicId,
    stageIdx,
    stars,
    badge: `第${stageIdx + 1}/6关 ${'⭐'.repeat(stars)} · ${title}`,
    story,
    questionShort: qShort,
    unit,
    answer: String(ans),
    hints,
    successNote: note,
    sandbox,
    choices
  };
}

        const b1 = 4, gapSec = randInt(2, 5), t1 = (b1 - 1) * gapSec, b2 = randInt(6, 9), ans = (b2 - 1) * gapSec;
        return makeProb('t03', 4, 3, '星港钟声间隔',
          `瑶湖母港的整点能量钟敲响 ${b1} 下用了 ${t1} 秒。那么到了敲响 ${b2} 下时，一共需要多少秒？`,

    /* -------------------- T04: 鸡兔同笼 (6 Distinct Sub-Types) -------------------- */
    case 't04': {

      }
      if (stageIdx === 1) {
        const N = randInt(6, 9), R = randInt(2, N - 2), totalP = (N - R) * 2 + R * 5;

          `补给箱里有双核电池(2格电)和五核电池(5格电)共 ${N} 块，总电量为 ${totalP} 格。请问【双核电池】有几块？（看清问谁哦！）`,
          '双核电池(2格)有几块？', '块', N - R,
          [`📡 假设 ${N} 块全是双核(2格)，电量 ${N*2} 格，差 ${totalP - N*2} 格。`, `🛠️ 五核电池有 (${totalP - N*2}) ÷ (5 - 2) = ${R} 块！`, `💡 题目问的是【双核电池】：${N} - ${R} = ${N - R} 块！`],
          `审题关键：假设全是小的，先算出的是大的(${R}块)，再用总数减得小的(${N-R}块)！`,
          { kind: 'legs_grid', N, low: 2, high: 5, target: totalP, units: Array(N).fill(2), started: true, lowIcon: '🔋', highIcon: '⚡', itemUnit: '格电' });
      }
      if (stageIdx === 2) {
        const N = randInt(7, 12), spiders = randInt(2, N - 2), ants = N - spiders, legs = spiders * 8 + ants * 6;
        return makeProb('t04', 2, 2, '八足蛛与六足虫机甲',
          `深空探测队派出八足蜘蛛机器人(8条腿)和六足昆虫机器人(6条腿)共 ${N} 台，一共数出 ${legs} 条机械腿。八足蜘蛛机器人有几台？`,
          '八足蜘蛛机器人有几台？', '台', spiders,
          [`📡 假设 ${N} 台全是 6 条腿：${N} × 6 = ${N * 6} 条腿！`, `🛠️ 实际多了 ${legs} - ${N * 6} = ${legs - N * 6} 条腿，每台八足蛛多 8 - 6 = 2 条腿！`, `💡 八足蛛 = ${legs - N * 6} ÷ 2 = ${spiders} 台！`],
          `不管几条腿，统一假设成腿数较少的那种最顺手！`);
      }
      if (stageIdx === 3) {
        const totalCoins = randInt(8, 14), fiveCount = randInt(3, totalCoins - 2), oneCount = totalCoins - fiveCount, sumVal = fiveCount * 5 + oneCount * 1;
        return makeProb('t04', 3, 2, '星际纪念币面值',
          `小机甲师攒了 1元 和 5元 两种滕王阁纪念币共 ${totalCoins} 枚，总面值正好是 ${sumVal} 元。其中 5元 纪念币有几枚？`,
          '5元纪念币有多少枚？', '枚', fiveCount,
          [`📡 假设 ${totalCoins} 枚全是 1元，只有 ${totalCoins} 元，还差 ${sumVal} - ${totalCoins} = ${sumVal - totalCoins} 元！`, `🛠️ 每把1枚1元换成5元，面值增加 5 - 1 = 4 元！`, `💡 5元枚数 = ${sumVal - totalCoins} ÷ 4 = ${fiveCount} 枚！`],
          `人民币硬币题就是穿着马甲的鸡兔同笼！`);
      }
      if (stageIdx === 4) {
        // 倒扣分问题！(答对+10，答错倒扣5 -> 错1题损失 10+5=15分!)
        const Q = 10, rightPts = 10, wrongPenalty = 5, wrong = randInt(1, 4), right = Q - wrong;

        '四足兽有多少台？', '台', rab,
        [`📡 没给总台数怎么办？先把多出来的 ${extraChk} 台双足机请出机库（带走 ${extraChk * 2} 条腿）！`, `🛠️ 剩下 ${totalLegs} - ${extraChk * 2} = ${totalLegs - extraChk * 2} 条腿，此时双足机和四足兽【台数一样多】！`, `💡 1台双足+1台四足打包成1组（共 2+4=6 条腿）：组数 = ${totalLegs - extraChk * 2} ÷ 6 = ${rab} 组，即四足兽有 ${rab} 台！`],

    /* -------------------- T05: 周期与余数 (6 Distinct Sub-Types) -------------------- */
    case 't05': {

            { val: '绿芒', label: '🌿 绿芒舱', color: 'border-emerald-500/70 bg-emerald-950/50 text-emerald-200' }
          ]);
      }
      if (stageIdx === 1) {
        const gPer = pickOne([2, 3]), P = 2 + gPer, groups = randInt(3, 5), rem = randInt(2, P - 1);
        const K = groups * P + rem, extra = Math.min(gPer, rem - 1), ans = groups * gPer + extra;
        return makeProb('t05', 1, 2, '周期内某类总数',
          `编队按【1先锋、${gPer}护卫、1支援】（每组${P}台）依次出港。前 ${K} 台里共有多少台【护卫机】？`,
          `前 ${K} 台共有几台护卫机？`, '台', ans,
          [`📡 ${K} ÷ ${P} = ${groups} 组 …… 余 ${rem} 台。`, `🛠️ 整组护卫：${groups} × ${gPer} = ${groups * gPer} 台。`, `💡 余下 ${rem} 台里还有 ${extra} 台护卫，共 ${ans} 台！`],
          `整组数量 + 余数尾巴里的数量！`,
          { kind: 'cycle_fleet', K, P, guardsPerGroup: gPer, groups, rem, extraGuards: extra, expanded: false });
      }
      if (stageIdx === 2) {
        // 周期数字求和! e.g. 2, 5, 3, 2, 5, 3...
        const seq = [2, 5, 1, 4], groupSum = 12, groups = randInt(4, 7), rem = randInt(1, 3), K = groups * 4 + rem;
        const remSum = seq.slice(0, rem).reduce((a, b) => a + b, 0), ans = groups * groupSum + remSum;
        return makeProb('t05', 2, 2, '循环密码串求和',
          `星门信号按“2、5、1、4、2、5、1、4……”不断重复发射。请问前 ${K} 个信号数字【加起来的总和】是多少？`,
          `前 ${K} 个数字之和是多少？`, '', ans,
          [`📡 每 4 个数为一组，先算一组的和：2 + 5 + 1 + 4 = 12！`, `🛠️ ${K} ÷ 4 = ${groups} 组 …… 余 ${rem} 个数（前${rem}个数是 ${seq.slice(0, rem).join('、')}）。`, `💡 总和 = ${groups} × 12 + ${remSum} = ${ans}！`],

      if (stageIdx === 3) {

          `在机甲解码算式【 ？ ÷ ${div} = ${q} …… △ 】中，余数 △ 最大能填几？此时被除数“？”最大是多少？`,

      }

        `星港塔顶的红灯每 ${p1} 秒闪一次，蓝灯每 ${p2} 秒闪一次。从两灯同时闪亮后开始计时，在接下来的 ${totalDays} 秒内，两盏灯还会【同时闪亮】多少次？`,
        `${totalDays}秒内同时闪亮几次？`, '次', ans,

    /* -------------------- T06: 和倍问题 (6 Distinct Sub-Types) -------------------- */
    case 't06': {
      if (stageIdx === 0) {
        const M = pickOne([2, 3, 4]), unit = randInt(6, 13), sum = unit * (1 + M), ans = unit * M;
        return makeProb('t06', 0, 1, '标准和倍求大数',

          '主库有多少颗晶石？', '颗', ans,
          [`📡 副库1份，主库${M}份，共 1+${M}=${1+M} 份。`, `🛠️ 1份 = ${sum} ÷ ${1+M} = ${unit} 颗。`, `💡 主库 = ${unit} × ${M} = ${ans} 颗！`],

          { kind: 'bar_sum_mult', sum, M, extra: 0, curM: 1, distributed: false, unit });
      }
      if (stageIdx === 1) {
        const M = pickOne([2, 3, 4]), unit = randInt(6, 12), extra = randInt(2, 7), sum = unit * (1 + M) + extra;
        return makeProb('t06', 1, 2, '几倍多几（去尾法）',
          `两库共存 ${sum} 颗晶石，主库比副库的 ${M} 倍【还多 ${extra} 颗】。副库有多少颗晶石？`,
          '副库有多少颗晶石？', '颗', unit,
          [`📡 先从总数减去多出的小尾巴 ${extra}：${sum} - ${extra} = ${sum - extra} 颗。`, `🛠️ 剩下的刚好分成 1 + ${M} = ${1 + M} 整份！`, `💡 副库 = ${sum - extra} ÷ ${1 + M} = ${unit} 颗！`],
          `几倍多几先减零头！`,
          { kind: 'bar_sum_mult', sum, M, extra, curM: M, distributed: false, unit });
      }
      if (stageIdx === 2) {
        // 几倍少几（添补法!）
        const M = pickOne([3, 4]), unit = randInt(7, 14), lack = randInt(2, 6), sum = unit * (1 + M) - lack;
        return makeProb('t06', 2, 2, '几倍少几（借补法）',
          `甲乙两队共有机甲 ${sum} 台，甲队比乙队的 ${M} 倍【少 ${lack} 台】。请问乙队有多少台机甲？`,
          '乙队有多少台机甲？', '台', unit,
          [`📡 甲队还差 ${lack} 台才满 ${M} 倍！我们先借给甲队 ${lack} 台补齐！`, `🛠️ 补齐后总数变成 ${sum} + ${lack} = ${sum + lack} 台，正好是 1 + ${M} = ${1 + M} 整份！`, `💡 乙队(1份) = ${sum + lack} ÷ ${1 + M} = ${unit} 台！`],

        const M = pickOne([2, 3]), w = randInt(5, 12), l = w * M, perim = (l + w) * 2;
        return makeProb('t06', 3, 3, '隐藏和·长方形周长',
          `瑶湖停机坪是一个长方形，周长是 ${perim} 米，已知长正好是宽的 ${M} 倍。请问停机坪的【长】是多少米？`,

          [`📡 头号陷阱：周长 ${perim} 米是【2条长 + 2条宽】！千万别直接拿 ${perim} 去除以(1+${M})！`, `🛠️ 先除以2求出 1条长 + 1条宽 的和：${perim} ÷ 2 = ${l + w} 米！`, `💡 宽(1份) = ${l + w} ÷ ${1 + M} = ${w} 米 → 长 = ${w} × ${M} = ${l} 米！`],

      if (stageIdx === 4) {

// Expanded 10-Type Clever Arithmetic Blitz Generator
function generateV3BlitzQuestion() {
  const kind = randInt(1, 10);
  if (kind === 1) {
    const base = pickOne([100, 200, 300]), d = pickOne([1, 2, 3]), a = base - d, b = randInt(25, 88), ans = a + b;
    return { expr: `${a} + ${b}`, tip: `凑整百：${base} + ${b} - ${d}`, ans: String(ans), options: shuffleOptions(ans, [ans + 2*d, ans - 10, ans + 10]) };
  }
  if (kind === 2) {
    const k = randInt(3, 9), ans = 25 * 4 * k;
    return { expr: `25 × ${4 * k}`, tip: `黄金搭档：25 × 4 × ${k}`, ans: String(ans), options: shuffleOptions(ans, [ans - 50, ans + 100, ans - 100]) };
  }
  if (kind === 3) {
    const c = randInt(220, 460), d = pickOne([1, 2, 3]), sub = 100 - d, ans = c - sub;
    return { expr: `${c} - ${sub}`, tip: `多减要加回：${c} - 100 + ${d}`, ans: String(ans), options: shuffleOptions(ans, [ans - 2*d, ans + 10, ans - 10]) };
  }
  if (kind === 4) {
    const a = randInt(18, 82), c = 100 - a, b = randInt(35, 96), ans = 100 + b;
    return { expr: `${a} + ${b} + ${c}`, tip: `互补牵手：(${a}+${c}) + ${b}`, ans: String(ans), options: shuffleOptions(ans, [ans - 10, ans + 10, ans + 4]) };
  }
  if (kind === 5) {
    const k = randInt(2, 8), ans = 1000 * k;
    return { expr: `125 × ${8 * k}`, tip: `超级搭档：125 × 8 × ${k}`, ans: String(ans), options: shuffleOptions(ans, [ans - 500, ans + 1000, ans - 200]) };
  }
  if (kind === 6) {
    const d1 = randInt(2, 6), d2 = randInt(1, 8 - d1), n = d1 * 10 + d2, ans = n * 11;
    return { expr: `${n} × 11`, tip: `两边一拉中间加：${d1}_${d1+d2}_${d2}`, ans: String(ans), options: shuffleOptions(ans, [ans + 10, ans - 10, n * 10 + d1]) };
  }
  if (kind === 7) {
    const sub1 = randInt(22, 78), sub2 = 100 - sub1, tot = randInt(210, 390), ans = tot - 100;
    return { expr: `${tot} - ${sub1} - ${sub2}`, tip: `连减打包：${tot} - (${sub1}+${sub2})`, ans: String(ans), options: shuffleOptions(ans, [ans + 20, ans - 10, ans + 10]) };
  }
  if (kind === 8) {
    const x = randInt(12, 35), ans = x * 99;
    return { expr: `${x} × 99`, tip: `拆99：${x} × 100 - ${x}`, ans: String(ans), options: shuffleOptions(ans, [x * 100 + x, ans + 10, ans - 10]) };
  }
  if (kind === 9) {
    const c = randInt(4, 9), a = randInt(25, 75), b = 100 - a, ans = 100 * c;
    return { expr: `${a}×${c} + ${b}×${c}`, tip: `合体：(${a}+${b}) × ${c}`, ans: String(ans), options: shuffleOptions(ans, [ans - c * 10, ans + c * 10, ans + 50]) };
  }
  const even = randInt(6, 24) * 2, ans = (even / 2) * 10;
  return { expr: `${even} × 5`, tip: `乘5神技：折半添0（${even}÷2×10）`, ans: String(ans), options: shuffleOptions(ans, [ans + 10, ans - 10, ans + 5]) };
}

// Generate Tower Floor Question (Floor 1..100 progressive difficulty!)
function generateTowerProblem(floorNum) {
  let poolTopics = [];
  let allowedStages = [];
  if (floorNum <= 15) {
    poolTopics = ['t01','t02','t03','t04','t05','t06'];
    allowedStages = [0, 1];
  } else if (floorNum <= 40) {
    poolTopics = ['t01','t02','t03','t04','t05','t06','t07','t08','t09','t10','t11','t12'];
    allowedStages = [1, 2, 3];
  } else if (floorNum <= 70) {
    poolTopics = ['t01','t02','t03','t04','t05','t06','t07','t08','t09','t10','t11','t12','t13','t14','t15','t16'];
    allowedStages = [2, 3, 4];
  } else {
    poolTopics = ['t01','t02','t03','t04','t05','t06','t07','t08','t09','t10','t11','t12','t13','t14','t15','t16'];
    allowedStages = [3, 4, 5];
  }
  const tid = pickOne(poolTopics);
  const stg = pickOne(allowedStages);
  return generateV3Problem(tid, stg);
}

                  const ang = (i / sb.gaps) * Math.PI * 2 - Math.PI / 2;

                <div class="flex items-center justify-around py-2 text-sm">

                        <span class="px-2.5 py-1 rounded ${r === sb.rem - 1 ? 'bg-[#3B2314] border-2 border-[#FBBF24] text-[#FDE68A] font-extrabold' : 'bg-[#16243D] text-[#94A3B8]'}">

              <button onclick="sbAction('sumDiffCut')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">✂️ 切去多出的+${sb.diff}</button>

              <div class="flex items-center gap-2">

              <div class="text-[#CBD5E1]">${sb.moved ? `💡 甲少 ${sb.give}、乙多 ${sb.give} 才一样多，原来甲比乙多 2 个 ${sb.give}！` : '点右上角调拨看看！'}</div>

        case 'mult_split': {
          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">🔥 黄金好朋友拆数炉</span>

        }

        case 'dist_combine': {
          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">🔗 乘法分配律合体舱</span>
              <button onclick="sbAction('distCombine')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0EA5E9] text-white">🔗 提取公因数 ×${sb.c}</button>
            </div>
            <div class="p-3 rounded-xl bg-[#0B1324] border border-[#23385C] text-center font-mono">
              ${!sb.combined
                ? `<div class="text-base font-extrabold">${sb.a} × ${sb.c} + ${sb.b} × ${sb.c}</div>`
                : `<div class="text-base font-extrabold text-[#34D399]">(${sb.a} + ${sb.b}) × ${sb.c} = 100 × ${sb.c}</div>`}
            </div>
          `;
        }

        case 'unit_funnel': {
          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">⚙️ 核心不变量计算器</span>
              <button onclick="sbAction('funnelSolve')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F59E0B] text-[#0B1220]">⚡ 先求中间核心量</button>
            </div>
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C] text-xs text-center">
              ${!sb.solvedUnit
                ? `<div class="text-[#94A3B8]">点击右上角，先算出中间桥梁数值！</div>`
                : sb.mode === 'norm'
                  ? `<div class="text-[#34D399] font-bold">1台机械臂产能（单一量）= ${sb.total1} ÷ ${sb.n1} = ${sb.unitRate} 块！再算 ${sb.n2} 台！</div>`
                  : `<div class="text-[#34D399] font-bold">两港总航程（总量）= ${sb.n1} × ${sb.total1} = ${sb.unitRate} 千米！再除以新速度 ${sb.n2}！</div>`}
            </div>
          `;
        }

        case 'age_slider': {
          const cAge = sb.nowC + sb.offset;
          const kAge = sb.nowK + sb.offset;
          const isMult = cAge === kAge * sb.M;
          return `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-[#FBBF24]">⏳ 时光推进器（当前 +${sb.offset} 年）</span>
              <div class="flex gap-1">
                <button onclick="sbAgeStep(-1)" class="px-2 py-1 rounded bg-[#1E2F4F] text-xs font-bold">-1年</button>
                <button onclick="sbAgeStep(1)" class="px-2.5 py-1 rounded bg-[#F59E0B] text-[#0B1220] text-xs font-extrabold">+1年</button>
              </div>

              <div class="${isMult ? 'text-[#34D399] font-extrabold' : 'text-[#94A3B8]'}">
                ${isMult ? `✅ 找到了！+${sb.offset}年后，${cAge} 正好是 ${kAge} 的 ${sb.M} 倍！` : `点 [+1年] 往后推演，看看哪一年舰长是你的 ${sb.M} 倍！`}
              </div>
            </div>
          `;
        }

        case 'age_sum_box': {
          return `

    /* Universal Sandbox Interaction Dispatchers */
    function sbAction(act) {
      sfxMechSwitch();
      const sb = missionRuntime.prob && missionRuntime.prob.sandbox;
      if (!sb) return;
      if (act === 'stairH') sb.slideH = !sb.slideH;
      else if (act === 'stairV') sb.slideV = !sb.slideV;
      else if (act === 'uPop') sb.popped = !sb.popped;
      else if (act === 'calcMerge') sb.merged = !sb.merged;
      else if (act === 'treesLit') sb.lit = !sb.lit;
      else if (act === 'legsStart') sb.started = true;
      else if (act === 'packCycle') sb.packed = !sb.packed;
      else if (act === 'expandFleet') sb.expanded = !sb.expanded;
      else if (act === 'barDist') sb.distributed = !sb.distributed;
      else if (act === 'diffMultRev') sb.revealed = !sb.revealed;
      else if (act === 'sumDiffCut') sb.cut = !sb.cut;
      else if (act === 'transferMove') sb.moved = !sb.moved;
      else if (act === 'multSplit') sb.split = !sb.split;
      else if (act === 'distCombine') sb.combined = !sb.combined;
      else if (act === 'funnelSolve') sb.solvedUnit = !sb.solvedUnit;
      else if (act === 'ageSumRev') sb.revealed = !sb.revealed;
      else if (act === 'vennSep') sb.separated = !sb.separated;
      else if (act === 'fireLines') sb.fired = !sb.fired;
      else if (act === 'scanRects') sb.scanned = !sb.scanned;
      else if (act === 'scaleChain') sb.expanded = !sb.expanded;
      else if (act === 'scaleDiff') sb.diffed = !sb.diffed;
      else if (act === 'revPipe') sb.reversed = !sb.reversed;
      else if (act === 'halfRestore') sb.restored = !sb.restored;
      else if (act === 'scanMagic') sb.scanned = !sb.scanned;
      render();
    }

    function sbToggleUnit(idx) {
      sfxMechSwitch();
      const sb = missionRuntime.prob.sandbox;
      sb.started = true;
      sb.units[idx] = sb.units[idx] === sb.low ? sb.high : sb.low;
      render();
    }

    function sbMultDelta(d) {
      sfxMechSwitch();
      const sb = missionRuntime.prob.sandbox;
      sb.curM = Math.max(1, Math.min(5, sb.curM + d));
      sb.distributed = false;
      render();
    }

    function sbAgeStep(d) {
      sfxMechSwitch();
      const sb = missionRuntime.prob.sandbox;
      sb.offset = Math.max(0, Math.min(10, sb.offset + d));
      render();

    function sbToggleLogic(idx) {
      sfxTap();
      const sb = missionRuntime.prob.sandbox;
      sb.cells[idx] = (sb.cells[idx] + 1) % 3;
      render();

      const obj = target === 'boss' ? bossRuntime : missionRuntime;

    function shuffleOptions(correctNum, distractors) {
      const set = new Set([String(correctNum)]);
      distractors.forEach(d => { if (d > 0) set.add(String(d)); });
      let pad = 1;
      while (set.size < 4) { set.add(String(Number(correctNum) + pad * 5)); pad++; }
      const arr = Array.from(set).slice(0, 4);
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_V3);
        if (raw) return Object.assign({}, defaultState, JSON.parse(raw));
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }
    function saveState() { try { localStorage.setItem(STORAGE_KEY_V3, JSON.stringify(state)); } catch (e) {} }

    function recordMistake(prob) {
      if (!prob || !prob.story) return;
      if (state.mistakes.some(m => m.story === prob.story)) return;
      state.mistakes.unshift({
        id: 'm_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        topicId: prob.topicId,
        stageIdx: prob.stageIdx,
        badge: prob.badge,
        story: prob.story,
        questionShort: prob.questionShort,
        unit: prob.unit || '',
        answer: prob.answer,
        hints: prob.hints || [],
        successNote: prob.successNote || '',
        choices: prob.choices || null
      });
      if (state.mistakes.length > 30) state.mistakes.length = 30;
      saveState();
    }

    function getClearedStageCount() {
      return Object.keys(state.stageClears).filter(k => state.stageClears[k] > 0).length;
    }

    function getMechaCombatStats() {
      let atk = 60 + (state.weaponLevel - 1) * 18 + Math.floor(getClearedStageCount() * 1.5);
      let hp = 140 + (state.weaponLevel - 1) * 25 + (state.towerFloor - 1) * 4;
      state.unlockedParts.forEach(pid => { if (MECHA_PARTS[pid]) { atk += MECHA_PARTS[pid].atk; hp += MECHA_PARTS[pid].hp; } });
      return { atk, hp };
    }

    function getPilotRank() {
      const c = getClearedStageCount();
      if (c >= 60 || state.towerFloor >= 50) return { title: '南昌深空 · 传奇总帅', badge: '👑' };
      if (c >= 30 || state.towerFloor >= 20) return { title: '滕王星塔 · 王牌统帅', badge: '🎖️' };
      if (c >= 12 || state.towerFloor >= 8) return { title: '南昌之星 · 精英机师', badge: '🚀' };
      if (c >= 3) return { title: '瑶湖母港 · 正式机师', badge: '🛠️' };
      return { title: '瑶湖母港 · 见习机甲师', badge: '🧑‍🚀' };
    }

        if (!btn) return;
        btn.className = state.activeTab === tab
          ? 'flex flex-col items-center justify-center py-1.5 rounded-xl bg-[#1B2D4E] text-[#FBBF24] border border-[#36568C] relative'
          : 'flex flex-col items-center justify-center py-1.5 rounded-xl text-[#94A3B8] relative';
      });
    }

    function switchTab(tab) {
      sfxTap(); stopSpeech();
      if (blitzRuntime.timerId && tab !== 'blitz') { clearInterval(blitzRuntime.timerId); blitzRuntime.timerId = null; blitzRuntime.running = false; }
      missionRuntime.mode = null; bossRuntime.activeBossId = null; state.activeTab = tab;
      if (tab === 'hangar') state.hasNewPartBadge = false;
      saveState(); render();
    }

    function render() {
      updateHeaderUI();
      const vp = document.getElementById('main-viewport');
      if (missionRuntime.mode) {
        document.getElementById('bottom-nav').classList.add('hidden');
        vp.classList.remove('pb-24'); vp.classList.add('pb-6');
        vp.innerHTML = renderActiveStageView();
        return;
      }
      if (bossRuntime.activeBossId) {
        document.getElementById('bottom-nav').classList.add('hidden');
        vp.classList.remove('pb-24'); vp.classList.add('pb-6');
        vp.innerHTML = renderActiveBossBattleView();
        return;
      }
      document.getElementById('bottom-nav').classList.remove('hidden');
      vp.classList.add('pb-24'); vp.classList.remove('pb-6');

      if (state.activeTab === 'missions') vp.innerHTML = renderMissionsTab();
      else if (state.activeTab === 'blitz') vp.innerHTML = renderTowerAndBlitzTab();
      else if (state.activeTab === 'boss') vp.innerHTML = renderBossHubTab();
      else if (state.activeTab === 'hangar') vp.innerHTML = renderHangarTab();
      else if (state.activeTab === 'parent') vp.innerHTML = renderParentAndMistakesTab();
    }

    /* ==================== TAB 1: 96-STAGE (16x6) MISSIONS HUB ==================== */
    function renderMissionsTab() {
      const cleared96 = getClearedStageCount();
      const pct = Math.round((cleared96 / 96) * 100);
      const chapObj = CHAPTERS.find(c => c.id === state.selectedChapter) || CHAPTERS[0];
      const filteredTopics = TOPICS.filter(t => t.chapter === chapObj.id);

      const chapterTabs = CHAPTERS.map(c => `<button onclick="selectChapter('${c.id}')" class="py-2 px-1.5 rounded-xl text-xs font-extrabold border transition-all ${
        c.id === chapObj.id ? 'bg-[#F59E0B] text-[#0B1220] border-[#FDE68A]' : 'bg-[#13213A] text-[#94A3B8] border-[#253C63]'
      }">${c.name}</button>`).join('');

      const topicCards = filteredTopics.map(t => {
        const titles = STAGE_TITLES[t.id];
        let doneInTopic = 0;
        for (let s = 0; s < 6; s++) { if ((state.stageClears[`${t.id}_${s}`] || 0) > 0) doneInTopic++; }
        const rewardPart = t.reward ? MECHA_PARTS[t.reward] : null;
        const partOwned = t.reward && state.unlockedParts.includes(t.reward);

        const stageGrid = titles.map((stName, idx) => {
          const cleared = (state.stageClears[`${t.id}_${idx}`] || 0) > 0;
          const stars = idx === 0 ? '★' : idx <= 3 ? '★★' : '★★★';
          return `<button onclick="startTopicStage('${t.id}', ${idx})" class="p-2 rounded-lg border text-left active:scale-95 transition-all ${
            cleared ? 'bg-[#064E3B]/70 border-[#10B981]/70 text-[#A7F3D0]' : 'bg-[#0D1729] border-[#243B63] text-[#E2E8F0]'
          }">
            <div class="flex items-center justify-between text-[10px]">
              <span class="font-mono text-[#FBBF24]">${idx+1}关 ${stars}</span>
              <span>${cleared ? '✅' : '▶'}</span>
            </div>
            <div class="text-[11px] font-bold truncate mt-0.5">${stName}</div>
          </button>`;
        }).join('');

        return `<div class="${doneInTopic === 6 ? 'tac-panel border-[#10B981]/60' : 'tac-panel'} p-3.5">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-xl bg-[#0D182C] border border-[#28426E] flex items-center justify-center text-lg shrink-0">${t.icon}</div>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-[#1B3054] text-[#38BDF8]">专题${t.code}</span>
                  <span class="text-[11px] text-[#94A3B8]">${t.link}</span>
                </div>
                <h3 class="text-sm font-extrabold text-[#F8FAFC] mt-0.5">${t.name}</h3>
              </div>
            </div>
            <span class="shrink-0 text-xs font-mono font-bold px-2 py-0.5 rounded-lg ${doneInTopic === 6 ? 'bg-[#064E3B] text-[#34D399]' : 'bg-[#1E293B] text-[#FBBF24]'}">${doneInTopic}/6关</span>
          </div>

          <!-- 6 Distinct Sub-Type Stages Grid -->
          <div class="grid grid-cols-3 gap-1.5 my-2">
            ${stageGrid}
          </div>

          <div class="pt-2 border-t border-[#223659] flex items-center justify-between text-[11px] text-[#94A3B8]">
            <span>${rewardPart ? `🎁 通任意2关掉：<strong class="text-[#FDE68A]">${rewardPart.icon}${rewardPart.name}</strong> ${partOwned ? '✅' : ''}` : '🎲 每关均内置多套随机数字引擎'}</span>
            <button onclick="startTopicStage('${t.id}', ${Math.min(5, doneInTopic)})" class="text-[#38BDF8] font-bold">连闯 ▶</button>
          </div>
        </div>`;
      }).join('');

      return `
        <section class="tac-panel p-3 mb-3 flex items-center gap-3">
          <div class="w-16 h-16 shrink-0 rounded-xl bg-[#091120] border border-[#243B63] flex items-center justify-center p-1 overflow-hidden" onclick="switchTab('hangar')">
            ${renderMechaSVG(state.unlockedParts, state.livery, false)}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-[#38BDF8]">96大母题关卡进度</span>
              <span class="font-mono font-extrabold text-[#FBBF24]">${cleared96}/96 关 (${pct}%)</span>
            </div>
            <div class="w-full h-2 bg-[#0B1324] rounded-full overflow-hidden border border-[#243A60] mt-1.5">
              <div class="h-full bg-gradient-to-r from-[#F59E0B] to-[#34D399]" style="width: ${Math.max(pct, 4)}%"></div>
            </div>
            <div class="text-[11px] text-[#94A3B8] mt-1.5">🔥 16专题×6阶难度=96类题型 + 滕王100层刷题塔（共3000+随机题）</div>
          </div>
        </section>

        <div class="grid grid-cols-4 gap-1.5 mb-2.5">${chapterTabs}</div>
        <div class="text-xs font-bold text-[#FDE68A] mb-2 px-0.5">🌌 ${chapObj.full}（点任意小关直接挑战）</div>
        <div class="space-y-3">${topicCards}</div>
      `;
    }

    function selectChapter(cid) { sfxTap(); state.selectedChapter = cid; saveState(); render(); }

    function startTopicStage(topicId, stageIdx) {
      sfxTap(); stopSpeech();
      missionRuntime = {
        mode: 'topic',
        activeTopicId: topicId,
        stageIndex: stageIdx,
        towerStep: 0,
        mistakeId: null,
        prob: generateV3Problem(topicId, stageIdx),
        userInput: '',
        hintLevel: 0,
        feedbackMsg: '',
        feedbackType: ''
      };
      render();
    }

    function startTowerFloor() {
      sfxMechSwitch(); stopSpeech();
      missionRuntime = {
        mode: 'tower',
        activeTopicId: null,
        stageIndex: 0,
        towerStep: 0,
        mistakeId: null,
        prob: generateTowerProblem(state.towerFloor),
        userInput: '',
        hintLevel: 0,
        feedbackMsg: '',
        feedbackType: ''
      };
      render();
    }

    function startMistakeRepair(mId) {
      sfxTap(); stopSpeech();
      const m = state.mistakes.find(x => x.id === mId);
      if (!m) return;
      missionRuntime = {
        mode: 'mistake',
        activeTopicId: m.topicId,
        stageIndex: m.stageIdx,
        towerStep: 0,
        mistakeId: m.id,
        prob: Object.assign({}, m, { sandbox: null }),
        userInput: '',
        hintLevel: 1,
        feedbackMsg: '🔧 错题修复模式：仔细看上方提示，答对即可修复装甲并消除此错题！',
        feedbackType: 'ok'
      };
      render();
    }

    function rerollCurrentStage() {
      sfxMechSwitch(); stopSpeech();
      if (missionRuntime.mode === 'tower') {
        missionRuntime.prob = generateTowerProblem(state.towerFloor);
      } else {
        missionRuntime.prob = generateV3Problem(missionRuntime.activeTopicId, missionRuntime.stageIndex);
      }
      missionRuntime.userInput = '';
      missionRuntime.hintLevel = 0;
      missionRuntime.feedbackMsg = '🎲 已为你生成全新随机数字与情景，开始挑战吧！';
      missionRuntime.feedbackType = 'ok';
      render();
    }

    function exitMission() { sfxTap(); stopSpeech(); missionRuntime.mode = null; render(); }

    function renderActiveStageView() {
      const prob = missionRuntime.prob;
      const topic = TOPICS.find(t => t.id === prob.topicId) || TOPICS[0];
      const headerLabel = missionRuntime.mode === 'tower'
        ? `🗼 滕王星塔 第${state.towerFloor}层 (${missionRuntime.towerStep + 1}/3题)`
        : missionRuntime.mode === 'mistake'
          ? `📕 错题装甲修复`
          : prob.badge;

      return `
        <div class="flex items-center justify-between mb-2.5 gap-1">
          <button onclick="exitMission()" class="tac-btn-slate px-2.5 py-1.5 text-xs">← 返回</button>
          <span class="text-xs font-extrabold text-[#FDE68A] truncate">${headerLabel}</span>
          <div class="flex items-center gap-1">
            ${missionRuntime.mode !== 'mistake' ? `<button onclick="rerollCurrentStage()" class="tac-btn-slate px-2 py-1.5 text-xs">🎲换题</button>` : ''}
            <button onclick="triggerRadarHint()" class="tac-btn-cyan px-2.5 py-1.5 text-xs">📡提示(${missionRuntime.hintLevel}/3)</button>
          </div>
        </div>

        <div class="tac-panel p-3.5 mb-2.5">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="text-xs font-bold text-[#38BDF8]">${topic.icon} ${topic.name}</span>
            <button onclick="speakCurrentStage()" class="px-2.5 py-1 rounded-lg text-xs font-bold border ${speakingNow ? 'bg-[#3B2314] border-[#FBBF24] text-[#FDE68A]' : 'bg-[#142744] border-[#38BDF8]/60 text-[#BAE6FD]'}">
              ${speakingNow ? '⏹️ 停止播报' : '🔈 语音读题'}
            </button>
          </div>
          <p class="text-sm text-[#F8FAFC] leading-relaxed font-medium">${prob.story}</p>
        </div>

        ${missionRuntime.hintLevel > 0 && prob.hints && prob.hints.length ? `
          <div class="mb-2.5 p-3 rounded-xl bg-[#0F2942] border border-[#38BDF8]/60 space-y-1.5 text-xs text-[#E0F2FE]">
            <div class="flex justify-between items-center">
              <span class="font-extrabold text-[#FBBF24]">📡 机甲副官三步拆解：</span>
              <button onclick="speakHints()" class="text-[11px] underline text-[#38BDF8]">🔈 朗读提示</button>
            </div>
            ${prob.hints.slice(0, missionRuntime.hintLevel).map(h => `<div class="leading-relaxed">${h}</div>`).join('')}
          </div>
        ` : ''}

        ${prob.sandbox ? `<div class="tac-panel p-3 mb-2.5">${renderDynamicSandbox(prob.sandbox)}</div>` : ''}

        ${missionRuntime.feedbackMsg ? `
          <div class="mb-2.5 px-3 py-2 rounded-xl text-xs font-bold leading-relaxed border ${
            missionRuntime.feedbackType === 'ok' ? 'bg-[#064E3B] border-[#10B981] text-[#A7F3D0]' : 'bg-[#3B2314] border-[#F59E0B] text-[#FDE68A]'
          }">${missionRuntime.feedbackMsg}</div>
        ` : ''}

        ${prob.choices ? renderChoicePad(prob) : renderThumbNumpad(prob, 'submitStageAnswer()')}
      `;
    }

    function speakCurrentStage() { if (missionRuntime.prob) speakText(missionRuntime.prob.story); }
    function speakHints() { if (missionRuntime.prob && missionRuntime.hintLevel > 0) speakText(missionRuntime.prob.hints.slice(0, missionRuntime.hintLevel).join('。')); }

    function submitStageChoice(val) { missionRuntime.userInput = val; submitStageAnswer(); }

    function submitStageAnswer() {
      stopSpeech();
      const prob = missionRuntime.prob;
      const topic = TOPICS.find(t => t.id === prob.topicId) || TOPICS[0];
      const cleaned = String(missionRuntime.userInput).trim();

      if (!cleaned) {
        sfxRecalibrate();
        missionRuntime.feedbackType = 'warn';
        missionRuntime.feedbackMsg = '🛰️ 请先用数字键输入答案数值哦！';
        render();
        return;
      }

      if (cleaned === prob.answer) {
        sfxSuccess();

        // Mode 1: Mistake Repair
        if (missionRuntime.mode === 'mistake') {
          state.mistakes = state.mistakes.filter(m => m.id !== missionRuntime.mistakeId);
          state.crystals += 25;
          saveState();
          showModal(`
            <div class="text-4xl mb-1">🛠️</div>
            <h3 class="text-lg font-extrabold text-[#34D399]">错题装甲成功修复！</h3>
            <p class="text-xs text-[#E2E8F0] mt-2 leading-relaxed text-left bg-[#0D1729] p-3 rounded-xl border border-[#243B61]">${prob.successNote}</p>
            <div class="text-xs font-bold text-[#FBBF24] mt-2">+25 💎 修复奖励（已从错题本移除）</div>
            <div class="grid grid-cols-2 gap-2 mt-3.5">
              <button onclick="hideModal(); startTopicStage('${prob.topicId}', ${prob.stageIdx});" class="tac-btn-cyan py-2.5 text-xs">🎲 同题型再巩固1道</button>
              <button onclick="closeModalAndGo('parent')" class="tac-btn-primary py-2.5 text-xs">返回错题舱</button>
            </div>
          `);
          return;
        }

        // Mode 2: 100-Floor Tower
        if (missionRuntime.mode === 'tower') {
          if (missionRuntime.towerStep < 2) {
            missionRuntime.towerStep += 1;
            missionRuntime.prob = generateTowerProblem(state.towerFloor);
            missionRuntime.userInput = '';
            missionRuntime.hintLevel = 0;
            missionRuntime.feedbackType = 'ok';
            missionRuntime.feedbackMsg = `✅ 第 ${missionRuntime.towerStep}/3 题突破！继续下一题冲顶本层！`;
            render();
            return;
          } else {
            const clearedFloor = state.towerFloor;
            state.towerFloor = Math.min(100, state.towerFloor + 1);
            const bonus = 50 + (clearedFloor % 5 === 0 ? 50 : 0);
            state.crystals += bonus;
            saveState();
            setTimeout(() => sfxUnlockPart(), 150);
            showModal(`
              <div class="text-4xl mb-1">🗼</div>
              <h3 class="text-lg font-extrabold text-[#FBBF24]">滕王星塔 第 ${clearedFloor} 层突破！</h3>
              <p class="text-xs text-[#A7F3D0] mt-2">机甲最大护盾永久 +4！获得赏金：<strong>+${bonus} 💎</strong></p>
              <div class="grid grid-cols-2 gap-2 mt-4">
                <button onclick="closeModalAndGo('blitz')" class="tac-btn-slate py-2.5 text-xs">稍作休整</button>
                <button onclick="hideModal(); startTowerFloor();" class="tac-btn-primary py-2.5 text-xs">⚡ 冲击第 ${state.towerFloor} 层</button>
              </div>
            `);
            return;
          }
        }

        // Mode 3: 6-Stage Topic Progression
        const key = `${prob.topicId}_${prob.stageIdx}`;
        state.stageClears[key] = (state.stageClears[key] || 0) + 1;
        state.crystals += 25 + prob.stars * 10;

        // Check if >=2 stages cleared in this topic -> drop Mecha Part!
        let doneCount = 0;
        for (let s = 0; s < 6; s++) { if ((state.stageClears[`${prob.topicId}_${s}`] || 0) > 0) doneCount++; }
        let unlockedHtml = '';
        if (topic.reward && doneCount >= 2 && !state.unlockedParts.includes(topic.reward)) {
          state.unlockedParts.push(topic.reward);
          state.hasNewPartBadge = true;
          const p = MECHA_PARTS[topic.reward];
          unlockedHtml = `<div class="mt-2.5 p-2.5 rounded-xl bg-[#162847] border border-[#FBBF24] flex items-center gap-2 text-left"><span class="text-2xl">${p.icon}</span><div><div class="text-xs font-extrabold text-[#FDE68A]">解锁新机甲部件：${p.name}</div><div class="text-[11px] text-[#94A3B8]">${p.desc}</div></div></div>`;
          setTimeout(() => sfxUnlockPart(), 160);
        }
        saveState();

        const hasNextStage = prob.stageIdx < 5;
        showModal(`
          <div class="text-4xl mb-1">${prob.stageIdx === 5 ? '👑' : '🎯'}</div>
          <h3 class="text-lg font-extrabold text-[#34D399]">${prob.badge.split('·')[1] || '本关'} 攻克！</h3>
          <p class="text-xs text-[#E2E8F0] mt-2 leading-relaxed text-left bg-[#0D1729] p-2.5 rounded-xl border border-[#243B61]">${prob.successNote}</p>
          ${unlockedHtml}
          <div class="grid grid-cols-2 gap-2 mt-3.5">
            <button onclick="hideModal(); startTopicStage('${prob.topicId}', ${prob.stageIdx});" class="tac-btn-slate py-2.5 text-xs">🎲 本关换数再练</button>
            ${hasNextStage
              ? `<button onclick="hideModal(); startTopicStage('${prob.topicId}', ${prob.stageIdx + 1});" class="tac-btn-primary py-2.5 text-xs">⚡ 下一关 (${prob.stageIdx + 2}/6)</button>`
              : `<button onclick="closeModalAndGo('missions')" class="tac-btn-primary py-2.5 text-xs">🏆 6关满贯·返航</button>`}
          </div>
        `);
      } else {
        sfxRecalibrate();
        recordMistake(prob);
        if (missionRuntime.hintLevel < 3) missionRuntime.hintLevel += 1;
        missionRuntime.feedbackType = 'warn';
        missionRuntime.feedbackMsg = `🔧 读数（${cleaned}）未吻合（已自动收入【📕错题舱】方便复习）。快看上方展开的第 ${missionRuntime.hintLevel} 步提示再试一次！`;
        missionRuntime.userInput = '';
        render();
      }
    }

    /* ==================== TAB 2: 100-FLOOR TOWER & 60S BLITZ ==================== */
    function renderTowerAndBlitzTab() {
      const modeSwitch = `
        <div class="grid grid-cols-2 gap-2 mb-3">
          <button onclick="setTowerSubMode('tower')" class="py-2 rounded-xl text-xs font-extrabold border ${state.towerSubMode === 'tower' ? 'bg-[#F59E0B] text-[#0B1220] border-[#FDE68A]' : 'bg-[#13213A] text-[#94A3B8] border-[#253C63]'}">🗼 滕王百层刷题塔</button>
          <button onclick="setTowerSubMode('blitz')" class="py-2 rounded-xl text-xs font-extrabold border ${state.towerSubMode === 'blitz' ? 'bg-[#F59E0B] text-[#0B1220] border-[#FDE68A]' : 'bg-[#13213A] text-[#94A3B8] border-[#253C63]'}">⚡ 60秒巧算极速舱</button>
        </div>
      `;

      if (state.towerSubMode === 'blitz') {
        return modeSwitch + renderBlitzInner();
      }

      const f = state.towerFloor;
      const tierName = f <= 15 ? '启航星层 (★入门综合)' : f <= 40 ? '进阶星层 (★★经典母题)' : f <= 70 ? '精锐星层 (★★★防坑进阶)' : '王者星层 (🏆杯赛压轴)';
      return modeSwitch + `
        <section class="tac-panel p-4 text-center">
          <div class="inline-block px-3 py-0.5 rounded-full bg-[#1B3054] text-[#38BDF8] text-xs font-bold mb-2">${tierName}</div>
          <div class="text-4xl my-1">🗼</div>
          <h2 class="text-xl font-extrabold text-[#F8FAFC]">滕王星际试炼塔 · 第 <span class="text-[#FBBF24] font-mono">${f}</span> / 100 层</h2>
          <p class="text-xs text-[#CBD5E1] mt-2 leading-relaxed">
            专为“想多刷题、综合练脑”设计！每层随机抽取 <strong class="text-[#FBBF24]">3 道跨专题奥数真题</strong>（共 300 道爬塔挑战），随层数自动提升难度，每通 1 层永久增加机甲护盾！
          </p>

          <div class="grid grid-cols-3 gap-2 my-4">
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C]">
              <div class="text-xs text-[#94A3B8]">当前层数</div>
              <div class="text-lg font-mono font-extrabold text-[#FBBF24] mt-0.5">${f}F</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C]">
              <div class="text-xs text-[#94A3B8]">护盾加成</div>
              <div class="text-lg font-mono font-extrabold text-[#34D399] mt-0.5">+${(f - 1) * 4}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[#0B1324] border border-[#23385C]">
              <div class="text-xs text-[#94A3B8]">本层赏金</div>
              <div class="text-lg font-mono font-extrabold text-[#38BDF8] mt-0.5">+${50 + (f % 5 === 0 ? 50 : 0)}💎</div>
            </div>
          </div>

          <button onclick="startTowerFloor()" class="tac-btn-primary w-full py-3.5 text-sm">
            🚀 开始挑战第 ${f} 层（连闯3题）
          </button>
        </section>
      `;
    }

    function setTowerSubMode(m) {
      sfxTap();
      if (blitzRuntime.timerId) { clearInterval(blitzRuntime.timerId); blitzRuntime.timerId = null; blitzRuntime.running = false; }
      state.towerSubMode = m;
      saveState(); render();
    }

    function renderBlitzInner() {
      if (!blitzRuntime.running) {

    function submitBossChoice(val) { bossRuntime.userInput = val; submitBossAnswer(); }
    function submitBossAnswer() {
      stopSpeech();
      const boss = BOSSES.find(b => b.id === bossRuntime.activeBossId), stats = getMechaCombatStats(), cleaned = String(bossRuntime.userInput).trim();

        bossRuntime.bossHp = Math.max(0, bossRuntime.bossHp - dmg); bossRuntime.bossHitAnim = true;

          if (!state.defeatedBosses.includes(boss.id)) state.defeatedBosses.push(boss.id);
          state.crystals += boss.rewardCrystals; saveState(); setTimeout(() => sfxUnlockPart(), 150);
          showModal(`<div class="text-4xl mb-1">🎉</div><h3 class="text-lg font-extrabold text-[#FBBF24]">成功讨伐【${boss.name}】！</h3><p class="text-xs text-[#A7F3D0] mt-2">获得荣耀勋章：<strong>${boss.medal}</strong></p><p class="text-xs text-[#FDE68A] mt-1">战利品：+${boss.rewardCrystals} 💎 超导晶石 ${boss.id === 'b1' ? '｜已解锁【暗星曜金】限定涂装！' : ''}</p><button onclick="closeBossModal('boss')" class="tac-btn-primary w-full py-2.5 mt-4 text-xs">凯旋返回母港</button>`);

        bossRuntime.battleLog = `🛡️ 偏差（正确为 ${bossRuntime.prob.answer}，已收入错题舱）！护盾承受反击 -${boss.atk} HP！`;
        if (bossRuntime.playerHp <= 0) {
          showModal(`<div class="text-4xl mb-1">🔧</div><h3 class="text-lg font-extrabold text-[#38BDF8]">护盾耗尽 · 紧急返航</h3><p class="text-xs text-[#CBD5E1] mt-2 leading-relaxed">刚才失误的题目已自动存入【📕错题舱】，去修复错题并强化机甲后再战吧！</p><button onclick="closeBossModal('parent')" class="tac-btn-primary w-full py-2.5 mt-4 text-xs">前往错题舱查看解析</button>`);
          return;
        }
      }

      bossRuntime.turn += 1; bossRuntime.userInput = ''; bossRuntime.prob = generateV3Problem(pickOne(boss.topics), randInt(0, maxStage)); render();

        }
        const listHtml = state.mistakes.map(m => `
          <div class="tac-panel p-3.5 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-[#FDA4AF]">🔧 ${m.badge || '待修复题目'}</span>

      return subNav + `

            <div class="p-2 rounded-xl bg-[#0B1324] border border-[#23385C]"><div class="text-base font-mono font-extrabold text-[#38BDF8]">${totalRuns}题</div><div class="text-[10px] text-[#94A3B8]">累计攻克</div></div>
          </div>
          <div class="space-y-2 mt-3">${chapterStats.map(cs => `<div><div class="flex justify-between text-xs mb-1"><span class="text-[#E2E8F0]">${cs.name}</span><span class="font-mono text-[#38BDF8]">${cs.done}/${cs.total}关 (${cs.pct}%)</span></div><div class="h-2 rounded-full bg-[#0B1324] overflow-hidden border border-[#22375B]"><div class="h-full bg-gradient-to-r from-[#0EA5E9] to-[#34D399]" style="width:${Math.max(cs.pct, 4)}%"></div></div></div>`).join('')}</div>
        </section>
        <section class="tac-panel p-3.5 space-y-2">
          <h3 class="text-xs font-extrabold text-[#CBD5E1]">🛠️ 家长调试与重置</h3>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="unlockAllDemo()" class="tac-btn-cyan py-2.5 text-xs">✨ 一键满配演示</button>
            <button onclick="resetProgressClean()" class="tac-btn-slate py-2.5 text-xs text-[#FDA4AF]">🔄 重置初始状态</button>
          </div>
        </section>
      `;
    }

    function setParentSub(m) { sfxTap(); state.parentSubMode = m; saveState(); render(); }
    function showModal(innerHtml) { document.getElementById('modal-box').innerHTML = innerHtml; document.getElementById('modal-overlay').classList.remove('hidden'); }
    function hideModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
    function closeModalAndGo(tab) { sfxTap(); hideModal(); missionRuntime.mode = null; state.activeTab = tab; saveState(); render(); }

    function unlockAllDemo() {
      sfxUnlockPart();
      state.unlockedParts = Object.keys(MECHA_PARTS);
      TOPICS.forEach(t => { for (let s = 0; s < 6; s++) state.stageClears[`${t.id}_${s}`] = 1; });
      state.towerFloor = 28;
      state.defeatedBosses = ['b1', 'b2'];
      state.weaponLevel = 6;
      state.crystals = 1200;
      state.hasNewPartBadge = true;
      saveState(); render();
    }
    function resetProgressClean() { sfxTap(); stopSpeech(); state = JSON.parse(JSON.stringify(defaultState)); saveState(); render(); }

    document.addEventListener('touchstart', function() { getAudioCtx(); }, { once: true, passive: true });
    render();

  </script>
</body>
</html>
